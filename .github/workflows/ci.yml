name: ci

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      validation_mode:
        description: "DEVELOPMENT garde ciblé ou FULL préproduction"
        required: true
        default: DEVELOPMENT
        type: choice
        options:
          - DEVELOPMENT
          - FULL

env:
  NODE_VERSION_FILE: apps/web/.nvmrc

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.detect-scope.outputs.docs_only }}
      web_code_relevant: ${{ steps.detect-scope.outputs.web_code_relevant }}
      mobile_code_relevant: ${{ steps.detect-scope.outputs.mobile_code_relevant }}
      build_relevant: ${{ steps.detect-scope.outputs.build_relevant }}
      dependency_graph_relevant: ${{ steps.detect-scope.outputs.dependency_graph_relevant }}
      dependency_audit_relevant: ${{ steps.detect-scope.outputs.dependency_audit_relevant }}
      security_tooling_relevant: ${{ steps.detect-scope.outputs.security_tooling_relevant }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect scope
        id: detect-scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VALIDATION_MODE: ${{ inputs.validation_mode }}
        run: node scripts/ci/detect-scope.mjs

  secret-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SECURITY_EVIDENCE_ROOT: artifacts/security-evidence

    steps:
      - name: Checkout candidate tree
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        id: setup_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}

      - name: Verify candidate tree and run secret audit
        id: secret_audit
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          npm run security:secrets -- --ref="$CANDIDATE_SHA"

      - name: Secrets security summary
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.setup_node.outcome == 'success' }}
        run: node scripts/ci/write-security-summary.mjs --gates=secrets

      - name: Upload compact secrets evidence
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.setup_node.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: security-secrets-evidence-${{ github.run_id }}
          path: artifacts/security-evidence/secret-audit.json
          if-no-files-found: ignore
          retention-days: 3

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      SECURITY_EVIDENCE_ROOT: artifacts/security-evidence

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        id: setup_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        id: install_node_dependencies
        run: npm ci

      - name: Test dependency audit controller
        run: node --test scripts/security/audit-dependencies.test.mjs

      - name: Dependency advisory audit
        id: dependency_audit
        run: npm run security:dependencies

      - name: Dependency security summary
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.setup_node.outcome == 'success' }}
        run: node scripts/ci/write-security-summary.mjs --gates=dependencies

      - name: Upload compact dependency evidence
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.setup_node.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: security-dependency-evidence-${{ github.run_id }}
          path: artifacts/security-evidence/dependency-advisory.json
          if-no-files-found: ignore
          retention-days: 3

  dependency-review:
    needs: scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high

  web-governance:
    needs: scope
    if: needs.scope.outputs.docs_only == 'true' || needs.scope.outputs.web_code_relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      SECURITY_EVIDENCE_ROOT: artifacts/security-evidence

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        id: setup_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify Node runtime contract
        run: node scripts/checks/check-node-version-contract.mjs

      - name: Install Node dependencies
        id: install_node_dependencies
        run: npm ci

      - name: Security deception contract
        run: npm run check:security-deception

      - name: Environment contract
        run: npm run check:env-contract

      - name: ClerkJS loader version contract
        run: npm run check:clerk-js-version

      - name: Root file hygiene
        run: npm run check:root-files

      - name: GitNexus hygiene
        run: npm run check:gitnexus-hygiene

      - name: Documentation governance
        run: npm run check:doc-governance

      - name: Stack documentation drift
        run: npm run check:stack-doc-drift

      - name: GitHub Actions security policy
        id: github_actions_security
        run: npm run check:github-actions

      - name: GitHub Actions security summary
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.setup_node.outcome == 'success' }}
        run: node scripts/ci/write-security-summary.mjs --gates=github-actions-security

      - name: Upload compact GitHub Actions security evidence
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.setup_node.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: security-github-actions-evidence-${{ github.run_id }}
          path: artifacts/security-evidence/github-actions-security.json
          if-no-files-found: ignore
          retention-days: 3

  web-static:
    needs: scope
    if: needs.scope.outputs.web_code_relevant == 'true' || needs.scope.outputs.security_tooling_relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      SECURITY_EVIDENCE_ROOT: artifacts/security-evidence

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        id: setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify Node runtime contract
        run: node scripts/checks/check-node-version-contract.mjs

      - name: Install Node dependencies
        id: install-node-dependencies
        run: npm ci

      - name: Install architectural Semgrep
        run: python -m pip install --disable-pip-version-check --no-input semgrep==1.177.0

      - name: Architectural Semgrep
        id: semgrep
        run: npm run check:semgrep

      - name: Lockfile policy
        run: npm run check:lockfile-policy

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: UTF-8 check for French-sensitive files
        run: npm run check:utf8-fr

      - name: Web lint
        run: npm run lint

      - name: Security tooling contract tests
        if: needs.scope.outputs.security_tooling_relevant == 'true'
        run: node --test scripts/security/workflow-security-contract.test.mjs scripts/security/zap-baseline-contract.test.mjs

      - name: Semgrep security summary
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.setup-node.outcome == 'success' && steps.install-node-dependencies.outcome == 'success' }}
        run: node scripts/ci/write-security-summary.mjs --gates=semgrep-architectural,semgrep-fixtures

      - name: Upload compact Semgrep evidence
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.setup-node.outcome == 'success' && steps.install-node-dependencies.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: security-semgrep-evidence-${{ github.run_id }}
          path: artifacts/security-evidence
          if-no-files-found: ignore
          retention-days: 3

  python-validation:
    needs: scope
    if: github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'FULL'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify candidate tree
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            maintenance/python/requirements-dev.txt
            maintenance/python/requirements-lock.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python maintenance dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r maintenance/python/requirements-dev.txt -c maintenance/python/requirements-lock.txt

      - name: Python full validation
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/run_checks.ps1 -Scope full -SkipE2E -SkipEncodingAutofix

  web-quality:
    needs: scope
    if: github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'FULL'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      QUALITY_EVIDENCE_ROOT: artifacts/quality-evidence

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        id: setup_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify Node runtime contract
        run: node scripts/checks/check-node-version-contract.mjs

      - name: Install Node dependencies
        id: install_node_dependencies
        run: npm ci

      - name: Heavy files policy (FULL)
        run: npm run quality:top-heavy

      - name: Dead-code ratchet
        run: npm run quality:dead-code

      - name: Complexity and function-length policy
        run: npm run quality:complexity

      - name: Duplication ratchet
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.setup_node.outcome == 'success' && steps.install_node_dependencies.outcome == 'success' }}
        continue-on-error: true
        run: npm run quality:duplication

      - name: Install GitNexus
        id: install_gitnexus
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.setup_node.outcome == 'success' && steps.install_node_dependencies.outcome == 'success' }}
        run: npm install --global gitnexus@1.6.12

      - name: Initialize GitNexus candidate index
        id: initialize_gitnexus
        if: ${{ !cancelled() && steps.install_gitnexus.outcome == 'success' }}
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          gitnexus analyze --index-only
          test -f .gitnexus/run.cjs
          node --input-type=module -e '
            import fs from "node:fs";
            const metadata = JSON.parse(fs.readFileSync(".gitnexus/gitnexus.json", "utf8"));
            if (metadata.lastCommit !== process.env.CANDIDATE_SHA) {
              throw new Error(`GitNexus index candidate mismatch: ${metadata.lastCommit} !== ${process.env.CANDIDATE_SHA}`);
            }
          '

      - name: Audit GitNexus candidate
        id: audit_gitnexus
        if: ${{ !cancelled() && steps.initialize_gitnexus.outcome == 'success' }}
        run: npm run audit:gitnexus

      - name: GitNexus cycle ratchet
        id: quality_cycles
        if: ${{ !cancelled() && steps.audit_gitnexus.outcome == 'success' }}
        continue-on-error: true
        run: npm run quality:cycles

      - name: Publish web-quality summary
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.setup_node.outcome == 'success' && steps.install_node_dependencies.outcome == 'success' }}
        run: node scripts/ci/write-quality-summary.mjs

      - name: Upload compact web-quality evidence
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.setup_node.outcome == 'success' && steps.install_node_dependencies.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web-quality-evidence-${{ github.run_id }}
          path: artifacts/quality-evidence
          if-no-files-found: ignore
          retention-days: 3

  web-tests:
    needs: scope
    if: needs.scope.outputs.web_code_relevant == 'true' || (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'FULL')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify Node runtime contract
        run: node scripts/checks/check-node-version-contract.mjs

      - name: Install Node dependencies
        run: npm ci

      - name: Web targeted security and regression tests
        run: npm run test:security && npm run test:regression-gates

      - name: Web full suite, coverage, and evidence (FULL only)
        if: github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'FULL'
        run: |
          node scripts/checks/validation-policy.mjs --assert-full-suite
          npm run test:coverage

      - name: Upload Web coverage evidence (FULL only)
        if: github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'FULL'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web-coverage-evidence-${{ github.sha }}
          path: |
            apps/web/coverage/coverage-summary.json
            apps/web/coverage/coverage-evidence.json
          if-no-files-found: error
          retention-days: 1

  web-coverage:
    needs: [scope, web-tests]
    if: github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'FULL' && needs.web-tests.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify Node runtime contract
        run: node scripts/checks/check-node-version-contract.mjs

      - name: Install Node dependencies
        run: npm ci

      - name: Download Web coverage evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: web-coverage-evidence-${{ github.sha }}
          path: apps/web/coverage

      - name: Web coverage ratchet from existing evidence
        run: npm run quality:coverage -- --from-existing-summary

  web-vercel-audit:
    needs: scope
    if: needs.scope.outputs.build_relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify Node runtime contract
        run: node scripts/checks/check-node-version-contract.mjs

      - name: Install Node dependencies
        run: npm ci

      - name: Vercel audit
        run: npm run audit:vercel:ci

  web-build:
    needs: scope
    if: needs.scope.outputs.build_relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify Node runtime contract
        run: node scripts/checks/check-node-version-contract.mjs

      - name: Install Node dependencies
        run: npm ci

      - name: Web production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: npm run build

  mobile-validation:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      SECURITY_EVIDENCE_ROOT: artifacts/security-evidence

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        id: setup_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify Node runtime contract
        run: node scripts/checks/check-node-version-contract.mjs

      - name: Install mobile dependencies
        id: install_node_dependencies
        run: npm ci

      - name: Install architectural Semgrep (mobile-only)
        if: needs.scope.outputs.web_code_relevant != 'true'
        run: python -m pip install --disable-pip-version-check --no-input semgrep==1.177.0

      - name: Architectural Semgrep (mobile-only)
        id: semgrep_mobile
        if: needs.scope.outputs.web_code_relevant != 'true'
        run: npm run check:semgrep

      - name: Mobile security tests
        run: npm run mobile:security

      - name: Mobile typecheck
        run: npm run mobile:typecheck

      - name: Mobile Vitest tests
        run: npm run mobile:test

      - name: Mobile Vitest coverage ratchet
        run: npm run quality:mobile-coverage

      - name: Mobile lint
        run: npm run mobile:lint

      - name: Semgrep security summary (mobile-only)
        if: ${{ always() && needs.scope.outputs.web_code_relevant != 'true' && steps.checkout.outcome == 'success' && steps.setup_node.outcome == 'success' && steps.install_node_dependencies.outcome == 'success' }}
        run: node scripts/ci/write-security-summary.mjs --gates=semgrep-architectural,semgrep-fixtures

      - name: Upload compact mobile Semgrep evidence
        if: ${{ always() && needs.scope.outputs.web_code_relevant != 'true' && steps.checkout.outcome == 'success' && steps.setup_node.outcome == 'success' && steps.install_node_dependencies.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: security-semgrep-mobile-evidence-${{ github.run_id }}
          path: artifacts/security-evidence
          if-no-files-found: ignore
          retention-days: 3
