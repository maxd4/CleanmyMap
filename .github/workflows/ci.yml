name: ci

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NODE_VERSION_FILE: apps/web/.nvmrc

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.detect-scope.outputs.docs_only }}
      web_code_relevant: ${{ steps.detect-scope.outputs.web_code_relevant }}
      mobile_code_relevant: ${{ steps.detect-scope.outputs.mobile_code_relevant }}
      build_relevant: ${{ steps.detect-scope.outputs.build_relevant }}
      dependency_graph_relevant: ${{ steps.detect-scope.outputs.dependency_graph_relevant }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect scope
        id: detect-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$EVENT_BEFORE"
            head="$EVENT_SHA"
          fi

          if [[ "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi

          changed_files="$(git diff --name-only "$base" "$head")"
          docs_only=true
          web_code_relevant=false
          mobile_code_relevant=false
          dependency_graph_relevant=false
          policy_args=(scripts/checks/validation-policy.mjs --scope changed --json)

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            policy_args+=(--changed-file "$file")

            case "$file" in
              documentation/*|*.md)
                ;;
              *)
                docs_only=false
                ;;
            esac

            case "$file" in
              package.json|package-lock.json|*/package.json|*/package-lock.json)
                dependency_graph_relevant=true
                ;;
            esac

            case "$file" in
              apps/mobile/*.md)
                ;;
              apps/mobile/*|.github/workflows/*|.nvmrc|.node-version|package.json|package-lock.json|scripts/checks/*)
                mobile_code_relevant=true
                ;;
            esac

            case "$file" in
              apps/web/*|.github/workflows/*|.nvmrc|.node-version|package.json|package-lock.json|scripts/checks/*)
                web_code_relevant=true
                ;;
            esac
          done <<< "$changed_files"

          policy_json="$(node "${policy_args[@]}")"
          build_relevant="$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).buildRelevant))' "$policy_json")"

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "web_code_relevant=$web_code_relevant" >> "$GITHUB_OUTPUT"
          echo "mobile_code_relevant=$mobile_code_relevant" >> "$GITHUB_OUTPUT"
          echo "build_relevant=$build_relevant" >> "$GITHUB_OUTPUT"
          echo "dependency_graph_relevant=$dependency_graph_relevant" >> "$GITHUB_OUTPUT"

  secret-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout candidate tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}

      - name: Verify candidate tree and run secret audit
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          npm run security:secrets -- --ref="$CANDIDATE_SHA"

  dependency-audit:
    needs: scope
    if: needs.scope.outputs.dependency_graph_relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Dependency advisory audit
        run: npm run security:dependencies

  dependency-review:
    needs: scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high

  web-governance:
    needs: scope
    if: needs.scope.outputs.docs_only == 'true' || needs.scope.outputs.web_code_relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify Node runtime contract
        run: node scripts/checks/check-node-version-contract.mjs

      - name: Install Node dependencies
        run: npm ci

      - name: Security deception contract
        run: npm run check:security-deception

      - name: Environment contract
        run: npm run check:env-contract

      - name: ClerkJS loader version contract
        run: npm run check:clerk-js-version

      - name: Root file hygiene
        run: npm run check:root-files

      - name: GitNexus hygiene
        run: npm run check:gitnexus-hygiene

      - name: Documentation governance
        run: npm run check:doc-governance

      - name: Stack documentation drift
        run: npm run check:stack-doc-drift

      - name: GitHub Actions security policy
        run: npm run check:github-actions

  web-static:
    needs: scope
    if: needs.scope.outputs.web_code_relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify Node runtime contract
        run: node scripts/checks/check-node-version-contract.mjs

      - name: Install Node dependencies
        id: install-node-dependencies
        run: npm ci

      - name: Install architectural Semgrep
        run: python -m pip install --disable-pip-version-check --no-input semgrep==1.177.0

      - name: Architectural Semgrep
        run: npm run check:semgrep

      - name: Lockfile policy
        run: npm run check:lockfile-policy

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: UTF-8 check for French-sensitive files
        run: npm run check:utf8-fr

      - name: Web lint
        run: npm run lint

  web-quality:
    needs: scope
    if: needs.scope.outputs.web_code_relevant == 'true' || needs.scope.outputs.mobile_code_relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify Node runtime contract
        run: node scripts/checks/check-node-version-contract.mjs

      - name: Install Node dependencies
        run: npm ci

      - name: Heavy files policy
        run: npm run quality:top-heavy

      - name: Dead-code ratchet
        run: npm run quality:dead-code

      - name: Complexity and function-length policy
        env:
          COMPLEXITY_CHANGED_FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run quality:complexity

      - name: Duplication ratchet
        run: npm run quality:duplication

      - name: Set up GitNexus cycle audit
        run: |
          npm install --global gitnexus@1.6.12
          npm run audit:gitnexus

      - name: GitNexus cycle ratchet
        run: npm run quality:cycles

  web-tests:
    needs: scope
    if: needs.scope.outputs.web_code_relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify Node runtime contract
        run: node scripts/checks/check-node-version-contract.mjs

      - name: Install Node dependencies
        run: npm ci

      - name: Web test policy
        run: node scripts/checks/validation-policy.mjs --assert-full-suite

      - name: Web Vitest tests, coverage, and evidence
        run: npm run test:coverage

      - name: Upload Web coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-coverage-evidence-${{ github.sha }}
          path: |
            apps/web/coverage/coverage-summary.json
            apps/web/coverage/coverage-evidence.json
          if-no-files-found: error
          retention-days: 1

  web-coverage:
    needs: [scope, web-tests]
    if: needs.scope.outputs.web_code_relevant == 'true' && needs.web-tests.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify Node runtime contract
        run: node scripts/checks/check-node-version-contract.mjs

      - name: Install Node dependencies
        run: npm ci

      - name: Download Web coverage evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: web-coverage-evidence-${{ github.sha }}
          path: apps/web/coverage

      - name: Web coverage ratchet from existing evidence
        run: npm run quality:coverage -- --from-existing-summary

  web-vercel-audit:
    needs: scope
    if: needs.scope.outputs.build_relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify Node runtime contract
        run: node scripts/checks/check-node-version-contract.mjs

      - name: Install Node dependencies
        run: npm ci

      - name: Vercel audit
        run: npm run audit:vercel:ci

  web-build:
    needs: scope
    if: needs.scope.outputs.build_relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify Node runtime contract
        run: node scripts/checks/check-node-version-contract.mjs

      - name: Install Node dependencies
        run: npm ci

      - name: Web production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: npm run build

  mobile-validation:
    needs: scope
    if: needs.scope.outputs.mobile_code_relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify Node runtime contract
        run: node scripts/checks/check-node-version-contract.mjs

      - name: Install mobile dependencies
        run: npm ci

      - name: Install architectural Semgrep (mobile-only)
        if: needs.scope.outputs.web_code_relevant != 'true'
        run: python -m pip install --disable-pip-version-check --no-input semgrep==1.177.0

      - name: Architectural Semgrep (mobile-only)
        if: needs.scope.outputs.web_code_relevant != 'true'
        run: npm run check:semgrep

      - name: Mobile security tests
        run: npm run mobile:security

      - name: Mobile typecheck
        run: npm run mobile:typecheck

      - name: Mobile Vitest tests
        run: npm run mobile:test

      - name: Mobile Vitest coverage ratchet
        run: npm run quality:mobile-coverage

      - name: Mobile lint
        run: npm run mobile:lint
