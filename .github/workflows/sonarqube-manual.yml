name: SonarQube Cloud manual analysis

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: sonarqube-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: Analyze repository with SonarQube Cloud
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            maintenance/python/requirements-dev.txt
            maintenance/python/requirements-lock.txt

      - name: Verify Node runtime contract
        run: node scripts/checks/check-node-version-contract.mjs

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install legacy Python PDF dependency
        run: "python -m pip install --disable-pip-version-check --no-input --no-cache-dir --no-deps --no-binary=:all: fpdf==1.7.2"

      - name: Install Python maintenance dependencies
        run: "python -m pip install --disable-pip-version-check --no-input --only-binary=:all: -r maintenance/python/requirements-dev.txt -c maintenance/python/requirements-lock.txt"

      - name: Generate Web coverage
        run: npm run test:coverage

      - name: Verify Web coverage ratchet
        id: web_coverage_ratchet
        continue-on-error: true
        run: npm run quality:coverage -- --from-existing-summary

      - name: Generate and verify Mobile coverage
        run: npm run quality:mobile-coverage

      - name: Generate Node scripts coverage
        run: npm run test:coverage:node

      - name: Generate Python maintenance coverage
        run: npm run test:coverage:python

      - name: Validate SonarQube LCOV reports
        run: node scripts/checks/prepare-sonarqube-coverage.mjs

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Enforce Web coverage ratchet verdict
        if: ${{ always() }}
        env:
          WEB_COVERAGE_RATCHET_OUTCOME: ${{ steps.web_coverage_ratchet.outcome }}
        run: |
          if [ "$WEB_COVERAGE_RATCHET_OUTCOME" != "success" ]; then
            echo "Web coverage ratchet failed; preserving the final workflow failure after downstream evidence steps."
            exit 1
          fi
