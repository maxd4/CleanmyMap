name: e2e-supabase-ephemeral

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "e2e/action-sharing.spec.ts"
      - "e2e/authenticated-campaign.spec.ts"
      - "e2e/signalement-campaign-2.spec.ts"
      - "e2e/fixtures/**"
      - "e2e/global.setup.ts"
      - "e2e/global.teardown.ts"
      - "e2e/run-github-actions-persistent.mjs"
      - "e2e/spogomi-concurrency.mjs"
      - "e2e/profile-security.sql"
      - "e2e/security-02-projection-revocation.sql"
      - "e2e/security-02-two-sessions.mjs"
      - "scripts/checks/spogomi-concurrency-destination.test.mjs"
      - "apps/web/src/lib/spogomi/**"
      - "apps/web/src/app/api/spogomi/**"
      - "apps/web/supabase/config.toml"
      - "apps/web/supabase/migrations/**"
      - "apps/web/supabase/seed.sql"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"

env:
  NODE_VERSION_FILE: apps/web/.nvmrc

jobs:
  persistent-e2e:
    name: Persistent E2E on ephemeral Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify Node runtime contract
        run: node scripts/checks/check-node-version-contract.mjs

      - name: Install Node dependencies
        run: npm ci

      - name: Audit canonical Supabase migration tree
        run: npm run audit:supabase-migration-trees

      - name: Verify canonical ephemeral Supabase inputs
        run: |
          test -d apps/web/supabase/migrations
          test -f apps/web/supabase/seed.sql

      - name: Start ephemeral Supabase
        id: start_supabase
        run: |
          mkdir -p artifacts/ci
          npx supabase start --workdir apps/web --yes > artifacts/ci/supabase-start.log 2>&1

      - name: Apply canonical migrations and seed
        run: |
          set -o pipefail
          npx supabase db reset --local --workdir apps/web --yes 2>&1 | tee artifacts/ci/supabase-reset.log

      - name: Preflight canonical ephemeral PostgreSQL schema
        run: |
          set -euo pipefail
          if ! test -f apps/web/supabase/config.toml; then
            echo "Preflight failed: canonical apps/web/supabase/config.toml is absent."
            exit 1
          fi
          if ! grep -Eq '^[[:space:]]*project_id[[:space:]]*=[[:space:]]*"web"[[:space:]]*$' apps/web/supabase/config.toml; then
            echo "Preflight failed: canonical config.toml does not declare project_id = \"web\"."
            exit 1
          fi

          status_file="$(mktemp)"
          status_error_file="$(mktemp)"
          trap 'rm -f "$status_file" "$status_error_file"' EXIT
          if ! npx supabase status --workdir apps/web --output json > "$status_file" 2> "$status_error_file"; then
            echo "Canonical Supabase config could not be loaded from apps/web."
            cat "$status_error_file"
            exit 1
          fi
          STATUS_FILE="$status_file" node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";

          const raw = readFileSync(process.env.STATUS_FILE, "utf8");
          const start = raw.indexOf("{");
          if (start < 0) throw new Error("Supabase status did not return JSON for apps/web.");
          const status = JSON.parse(raw.slice(start));
          const apiUrl = new URL(status.API_URL ?? "");
          if (apiUrl.hostname !== "127.0.0.1" && apiUrl.hostname !== "localhost") {
            throw new Error("Supabase status did not describe a local ephemeral API.");
          }
          NODE

          preflight_sql="$(cat <<'SQL'
          do $$
          declare
            migration_count bigint;
          begin
            if to_regclass('public.actions') is null then
              raise exception 'Preflight failed: public.actions is absent after canonical reset';
            end if;
            if to_regclass('public.spogomi_events') is null then
              raise exception 'Preflight failed: public.spogomi_events is absent after canonical reset';
            end if;
            if to_regclass('supabase_migrations.schema_migrations') is null then
              raise exception 'Preflight failed: migration registry is absent after canonical reset';
            end if;
            select count(*) into migration_count
            from supabase_migrations.schema_migrations
            where version ~ '^[0-9]{14}$';
            if migration_count = 0 then
              raise exception 'Preflight failed: no canonical application migration is registered';
            end if;
            if not exists (
              select 1
              from public.actions
              where id = '6d7f6c3d-7d66-4c95-9e5a-5d2d9efb0b71'::uuid
                and notes like 'E2E_FIXTURE:group-join:v1%'
            ) then
              raise exception 'Preflight failed: canonical E2E seed fixture is absent';
            end if;
            raise notice 'Preflight passed: canonical config, PostgreSQL schema, migrations and seed fixture are present';
          end
          $$;
          SQL
          )"
          echo "Running SECURITY-01 PostgreSQL role and column privilege contract"
          profile_security_sql="$(cat e2e/profile-security.sql)"
          security_02_sql="$(cat e2e/security-02-projection-revocation.sql)"
          npx supabase db query --workdir apps/web --local "$preflight_sql
$profile_security_sql
$security_02_sql" 2>&1 | tee artifacts/ci/supabase-preflight.log

          echo "Running SECURITY-02 PostgreSQL two-session contract"
          node e2e/security-02-two-sessions.mjs 2>&1 | tee -a artifacts/ci/supabase-preflight.log

      - name: Synchronize PostgREST schema after PostgreSQL proof
        run: |
          npx supabase db query --workdir apps/web --local "notify pgrst, 'reload schema';"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run SPOGOMI business tests
        run: |
          npm run test -w apps/web -- \
            src/lib/spogomi/preparation-service.gpx.test.ts \
            src/lib/spogomi/preparation-migration.contract.test.ts \
            src/lib/spogomi/composition-lock-routes.contract.test.ts \
            src/lib/spogomi/preparation-service.preview.test.ts

      - name: Run SPOGOMI PostgreSQL two-session concurrency tests
        run: node e2e/spogomi-concurrency.mjs

      - name: Verify persistent Playwright projects are listable
        run: |
          npx playwright test --list \
            --project="action sharing" \
            --project="authenticated campaign" \
            --project="signalement campaign 2"

      - name: Run persistent E2E
        id: persistent_e2e
        env:
          CMM_E2E_CLERK_DEV_BACKEND_TOKEN: ${{ secrets.CMM_E2E_CLERK_DEV_BACKEND_TOKEN }}
          CMM_E2E_CLERK_DEV_PUBLISHABLE_KEY: ${{ secrets.CMM_E2E_CLERK_DEV_PUBLISHABLE_KEY }}
        run: npm run test:e2e:persistent:ci

      - name: Stop ephemeral Supabase
        if: always()
        run: |
          mkdir -p artifacts/ci
          containers="$(docker ps -a --format '{{.Names}}' 2>/dev/null | grep '^supabase_' || true)"
          if [ -z "$containers" ]; then
            echo "No ephemeral Supabase containers exist; skipping stop."
            exit 0
          fi
          npx supabase stop --workdir apps/web --no-backup > artifacts/ci/supabase-stop.log 2>&1

      - name: Remove ephemeral credentials
        if: always()
        run: |
          rm -f apps/web/.env.local

      - name: Stage safe public E2E evidence
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.persistent_e2e.outcome }}
        run: node scripts/checks/stage-public-e2e-artifact.mjs

      - name: Validate safe public E2E evidence
        id: validate_public_e2e
        if: always()
        run: node scripts/checks/check-public-e2e-artifact.mjs artifacts/ci-public-evidence

      - name: Upload safe public E2E evidence
        if: always() && steps.validate_public_e2e.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cleanmymap-public-e2e-evidence
          path: artifacts/ci-public-evidence
          if-no-files-found: error
          retention-days: 3

      - name: Remove ephemeral Supabase logs
        if: always()
        run: |
          rm -f artifacts/ci/supabase-start.log artifacts/ci/supabase-reset.log artifacts/ci/supabase-stop.log
