name: e2e-supabase-ephemeral

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'FULL') || github.event_name == 'schedule' && 'FULL' || 'DEVELOPMENT' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' }}

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      validation_mode:
        description: "DEVELOPMENT (proportionné au diff) ou FULL (campagne complète)"
        required: true
        default: DEVELOPMENT
        type: choice
        options:
          - DEVELOPMENT
          - FULL
  push:
    branches:
      - main
    paths:
      - "e2e/*.spec.ts"
      - "e2e/**/*.spec.ts"
      - "e2e/*.test.ts"
      - "e2e/**/*.test.ts"
      - "e2e/fixtures/**"
      - "e2e/global.setup.ts"
      - "e2e/global.teardown.ts"
      - "e2e/run-github-actions-persistent.mjs"
      - "e2e/spogomi-cachan-integration.mjs"
      - "e2e/spogomi-cachan-local-app.mjs"
      - "e2e/spogomi-cachan-local-app.test.mjs"
      - "documentation/features/spogomi-references/fixtures/**"
      - "apps/web/src/lib/spogomi/**"
      - "apps/web/src/app/api/spogomi/**"
      - "apps/web/src/app/api/gamification/spogomi/**"
      - "apps/web/src/components/spogomi/**"
      - "apps/web/src/app/(app)/spogomi/**"
      - "apps/web/src/app/(app)/dashboard/spogomi/**"
      - "apps/web/src/lib/actions/**"
      - "apps/web/src/app/api/actions/**"
      - "apps/web/src/lib/reports/**"
      - "apps/web/src/app/api/reports/**"
      - "apps/web/src/lib/signalements/**"
      - "apps/web/src/app/api/signalements/**"
      - "apps/web/src/lib/personal-ai/**"
      - "apps/web/src/app/api/personal-ai/**"
      - "apps/web/src/app/reglages/**"
      - "apps/web/src/components/account/**"
      - "apps/web/src/app/page.tsx"
      - "apps/web/src/app/api/homepage/**"
      - "apps/web/src/components/accueil/**"
      - "apps/web/src/lib/accueil/**"
      - "apps/web/src/lib/partners/**"
      - "apps/web/src/components/sections/rubriques/annuaire/**"
      - "apps/web/src/proxy.ts"
      - "apps/web/src/lib/authz*"
      - "apps/web/src/lib/auth/**"
      - "apps/web/src/components/auth/**"
      - "apps/web/src/app/(auth)/**"
      - "apps/web/src/lib/profiles*"
      - "apps/web/src/lib/supabase/**"
      - "apps/web/src/lib/http/api-errors*"
      - "apps/web/supabase/config.toml"
      - "apps/web/supabase/migrations/**"
      - "apps/web/supabase/seed.sql"
      - "scripts/ci/start-supabase-ephemeral.sh"
      - "scripts/ci/supabase-config.mjs"
      - "scripts/ci/supabase-config.test.mjs"
      - "scripts/ci/diagnose-supabase-start.mjs"
      - "scripts/ci/diagnose-supabase-start.test.mjs"
      - "scripts/ci/e2e-project-catalog.mjs"
      - "scripts/ci/select-e2e-sql-plan.mjs"
      - "scripts/ci/ci-timing-report.mjs"
      - "scripts/dev/**"
      - ".github/workflows/e2e-supabase.yml"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches:
      - main
    paths:
      - "e2e/*.spec.ts"
      - "e2e/**/*.spec.ts"
      - "e2e/*.test.ts"
      - "e2e/**/*.test.ts"
      - "e2e/fixtures/**"
      - "e2e/global.setup.ts"
      - "e2e/global.teardown.ts"
      - "e2e/run-github-actions-persistent.mjs"
      - "e2e/spogomi-cachan-integration.mjs"
      - "e2e/spogomi-cachan-local-app.mjs"
      - "e2e/spogomi-cachan-local-app.test.mjs"
      - "documentation/features/spogomi-references/fixtures/**"
      - "scripts/ci/diagnose-supabase-start.mjs"
      - "scripts/ci/diagnose-supabase-start.test.mjs"
      - "scripts/ci/start-supabase-ephemeral.sh"
      - "scripts/ci/supabase-config.mjs"
      - "scripts/ci/supabase-config.test.mjs"
      - "scripts/ci/e2e-project-catalog.mjs"
      - "scripts/ci/select-e2e-sql-plan.mjs"
      - "scripts/ci/ci-timing-report.mjs"
      - "scripts/dev/**"
      - "apps/web/src/lib/spogomi/**"
      - "apps/web/src/app/api/spogomi/**"
      - "apps/web/src/app/api/gamification/spogomi/**"
      - "apps/web/src/components/spogomi/**"
      - "apps/web/src/app/(app)/spogomi/**"
      - "apps/web/src/app/(app)/dashboard/spogomi/**"
      - "apps/web/src/lib/actions/**"
      - "apps/web/src/app/api/actions/**"
      - "apps/web/src/lib/reports/**"
      - "apps/web/src/app/api/reports/**"
      - "apps/web/src/lib/signalements/**"
      - "apps/web/src/app/api/signalements/**"
      - "apps/web/src/lib/personal-ai/**"
      - "apps/web/src/app/api/personal-ai/**"
      - "apps/web/src/app/reglages/**"
      - "apps/web/src/components/account/**"
      - "apps/web/src/app/page.tsx"
      - "apps/web/src/app/api/homepage/**"
      - "apps/web/src/components/accueil/**"
      - "apps/web/src/lib/accueil/**"
      - "apps/web/src/lib/partners/**"
      - "apps/web/src/components/sections/rubriques/annuaire/**"
      - "apps/web/src/proxy.ts"
      - "apps/web/src/lib/authz*"
      - "apps/web/src/lib/auth/**"
      - "apps/web/src/components/auth/**"
      - "apps/web/src/app/(auth)/**"
      - "apps/web/src/lib/profiles*"
      - "apps/web/src/lib/supabase/**"
      - "apps/web/src/lib/http/api-errors*"
      - "apps/web/supabase/config.toml"
      - "apps/web/supabase/migrations/**"
      - "apps/web/supabase/seed.sql"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"

env:
  NODE_VERSION_FILE: apps/web/.nvmrc
  # GitHub-hosted runners share egress IPs; use the Supabase CLI's GHCR mirror
  # to avoid public ECR rate limiting during the ephemeral stack pull.
  SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io

jobs:
  plan:
    name: Plan proportionate E2E campaign
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.select.outputs.docs_only }}
      e2e_should_run: ${{ steps.select.outputs.e2e_should_run }}
      run_spogomi_integration: ${{ steps.select.outputs.run_spogomi_integration }}
      run_spogomi_business_tests: ${{ steps.select.outputs.run_spogomi_business_tests }}
      run_persistent_e2e: ${{ steps.select.outputs.run_persistent_e2e }}
      playwright_projects: ${{ steps.select.outputs.playwright_projects }}
      unmapped_e2e_files: ${{ steps.select.outputs.unmapped_e2e_files }}
      reason: ${{ steps.select.outputs.reason }}
      inputs_digest: ${{ steps.select.outputs.inputs_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}

      - name: Select proportionate E2E plan
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VALIDATION_MODE: ${{ inputs.validation_mode }}
        run: node scripts/ci/select-e2e-sql-plan.mjs

  persistent-e2e:
    name: Persistent E2E on ephemeral Supabase
    needs: plan
    # Manual runs can execute credential-bearing Clerk steps only from the
    # current main ref. Pure docs or unrelated changes are skipped by policy.
    if: needs.plan.outputs.e2e_should_run == 'true' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    # Hosted runner only. The generated Supabase network was absent in recent
    # failures, so the existing CLI lane receives one run-scoped bridge network.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify manual run targets current main
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ -z "$current_main_sha" || "$current_main_sha" != "$GITHUB_SHA" ]]; then
            echo "Manual E2E runs must target the current main SHA."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify Node runtime contract
        run: node scripts/checks/check-node-version-contract.mjs

      - name: Restore Node modules cache
        id: node_modules_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            node_modules
            apps/web/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json', 'apps/web/.nvmrc') }}

      - name: Install Node dependencies
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Audit canonical Supabase migration tree
        run: npm run audit:supabase-migration-trees

      - name: Validate changed PostgreSQL SQL syntax
        id: validate_sql
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            mapfile -t changed_sql < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'apps/web/supabase/migrations/**/*.sql' 'apps/web/supabase/tests/**/*.sql' 'e2e/**/*.sql')
          else
            mapfile -t changed_sql < <(git diff --name-only "$base_sha" "$GITHUB_SHA" -- 'apps/web/supabase/migrations/**/*.sql' 'apps/web/supabase/tests/**/*.sql' 'e2e/**/*.sql')
          fi
          args=(scripts/ci/validate-sql-syntax.mjs "--ref=$GITHUB_SHA")
          for file in "${changed_sql[@]}"; do
            [[ -n "$file" ]] && args+=("--changed-file=$file")
          done
          printf 'priority_files=%s\n' "$(IFS=,; echo "${changed_sql[*]}")" >> "$GITHUB_OUTPUT"
          node "${args[@]}"

      - name: Verify canonical ephemeral Supabase inputs
        run: |
          test -d apps/web/supabase/migrations
          test -f apps/web/supabase/seed.sql

      - name: Prepare isolated Supabase Docker network
        id: supabase_network
        run: |
          set -euo pipefail
          network_name="cleanmymap-supabase-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          network_id="$(docker network create --driver bridge --label com.cleanmymap.ci=ephemeral "$network_name")"
          test -n "$network_id"
          echo "network_name=$network_name" >> "$GITHUB_OUTPUT"

      - name: Start ephemeral Supabase
        id: start_supabase
        run: |
          mkdir -p artifacts/ci
          bash scripts/ci/start-supabase-ephemeral.sh apps/web "${{ steps.supabase_network.outputs.network_name }}" artifacts/ci/supabase-start-diagnostic.txt

      - name: Apply canonical migrations and seed
        run: |
          set -o pipefail
          ./node_modules/.bin/supabase db reset --local --workdir apps/web --yes --network-id="${{ steps.supabase_network.outputs.network_name }}" 2>&1 | tee artifacts/ci/supabase-reset.log

      - name: Preflight canonical ephemeral PostgreSQL schema
        run: |
          set -euo pipefail
          if ! test -f apps/web/supabase/config.toml; then
            echo "Preflight failed: canonical apps/web/supabase/config.toml is absent."
            exit 1
          fi
          if ! grep -Eq '^[[:space:]]*project_id[[:space:]]*=[[:space:]]*"web"[[:space:]]*$' apps/web/supabase/config.toml; then
            echo "Preflight failed: canonical config.toml does not declare project_id = \"web\"."
            exit 1
          fi

          status_file="$(mktemp)"
          status_error_file="$(mktemp)"
          trap 'rm -f "$status_file" "$status_error_file"' EXIT
          if ! ./node_modules/.bin/supabase status --workdir apps/web --output json > "$status_file" 2> "$status_error_file"; then
            echo "Canonical Supabase config could not be loaded from apps/web."
            cat "$status_error_file"
            exit 1
          fi
          STATUS_FILE="$status_file" node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";

          const raw = readFileSync(process.env.STATUS_FILE, "utf8");
          const start = raw.indexOf("{");
          if (start < 0) throw new Error("Supabase status did not return JSON for apps/web.");
          const status = JSON.parse(raw.slice(start));
          const apiUrl = new URL(status.API_URL ?? "");
          if (apiUrl.hostname !== "127.0.0.1" && apiUrl.hostname !== "localhost") {
            throw new Error("Supabase status did not describe a local ephemeral API.");
          }
          NODE

          preflight_sql="$(cat <<'SQL'
          select case
            when to_regclass('public.actions') is not null
              and to_regclass('public.spogomi_events') is not null
              and to_regclass('supabase_migrations.schema_migrations') is not null
              and exists (
                select 1
                from supabase_migrations.schema_migrations
                where version ~ '^[0-9]{14}$'
              )
              and exists (
                select 1
                from public.actions
                where id = '6d7f6c3d-7d66-4c95-9e5a-5d2d9efb0b71'::uuid
                  and notes like 'E2E_FIXTURE:group-join:v1%'
              )
              then 'Preflight passed: canonical config, PostgreSQL schema, migrations and seed fixture are present'
            else 'Preflight failed: canonical schema, migration registry or seed fixture invariant is absent'
          end as preflight_marker;
          SQL
          )"
          echo "Running canonical PostgreSQL schema preflight"
          ./node_modules/.bin/supabase db query --workdir apps/web --local "$preflight_sql" 2>&1 | tee artifacts/ci/supabase-preflight.log
          grep -q "Preflight passed: canonical config, PostgreSQL schema, migrations and seed fixture are present" artifacts/ci/supabase-preflight.log

      - name: Synchronize PostgREST schema before application tests
        run: |
          ./node_modules/.bin/supabase db query --workdir apps/web --local "notify pgrst, 'reload schema';"

      - name: Restore Playwright Chromium cache
        if: needs.plan.outputs.run_persistent_e2e == 'true' || needs.plan.outputs.run_spogomi_integration == 'true'
        id: playwright_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium browser (cache miss)
        if: (needs.plan.outputs.run_persistent_e2e == 'true' || needs.plan.outputs.run_spogomi_integration == 'true') && steps.playwright_cache.outputs.cache-hit != 'true'
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Install Playwright system dependencies (cache hit)
        if: (needs.plan.outputs.run_persistent_e2e == 'true' || needs.plan.outputs.run_spogomi_integration == 'true') && steps.playwright_cache.outputs.cache-hit == 'true'
        run: ./node_modules/.bin/playwright install-deps chromium

      - name: Run SPOGOMI business tests (FULL campaign)
        if: needs.plan.outputs.run_spogomi_business_tests == 'true'
        run: |
          npm run test -w apps/web -- \
            src/lib/spogomi/preparation/preparation-service.gpx.test.ts \
            src/lib/spogomi/preparation/preparation-migration.contract.test.ts \
            src/lib/spogomi/preparation/composition-lock-routes.contract.test.ts \
            src/lib/spogomi/preparation/preparation-service.preview.test.ts

      - name: Verify persistent Playwright projects are listable
        if: needs.plan.outputs.run_persistent_e2e == 'true'
        run: |
          ./node_modules/.bin/playwright test --list \
            --project="action sharing" \
            --project="authenticated campaign" \
            --project="signalement campaign 2"

      - name: Run SPOGOMI Cachan mixed integration on ephemeral Supabase
        id: spogomi_integration
        if: needs.plan.outputs.run_spogomi_integration == 'true'
        continue-on-error: true
        env:
          CMM_SUPABASE_TEST_ENVIRONMENT: ephemeral
          CMM_SUPABASE_EPHEMERAL_TEST_AUTHORIZATION: I_UNDERSTAND_EPHEMERAL_ONLY
          CMM_E2E_CLERK_DEV_BACKEND_TOKEN: ${{ secrets.CMM_E2E_CLERK_DEV_BACKEND_TOKEN }}
          CMM_E2E_CLERK_DEV_PUBLISHABLE_KEY: ${{ secrets.CMM_E2E_CLERK_DEV_PUBLISHABLE_KEY }}
        run: node e2e/spogomi-cachan-integration.mjs

      - name: Reject external pull request secret execution
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "External pull requests cannot execute the Clerk Development secret-bearing E2E step."
          exit 1

      - name: Run persistent E2E
        id: persistent_e2e
        if: success() && needs.plan.outputs.run_persistent_e2e == 'true'
        env:
          CMM_E2E_CLERK_DEV_BACKEND_TOKEN: ${{ secrets.CMM_E2E_CLERK_DEV_BACKEND_TOKEN }}
          CMM_E2E_CLERK_DEV_PUBLISHABLE_KEY: ${{ secrets.CMM_E2E_CLERK_DEV_PUBLISHABLE_KEY }}
          PLAYWRIGHT_PROJECTS: ${{ needs.plan.outputs.playwright_projects }}
          UNMAPPED_E2E_FILES: ${{ needs.plan.outputs.unmapped_e2e_files }}
        run: npm run test:e2e:persistent:ci

      - name: Fail if independent SPOGOMI integration failed
        if: (!cancelled()) && steps.spogomi_integration.outcome == 'failure'
        run: |
          echo "SPOGOMI Cachan mixed integration failed (persistent E2E was still evaluated independently)."
          exit 1

      - name: Stop ephemeral Supabase
        if: always()
        run: |
          mkdir -p artifacts/ci
          containers="$(docker ps -a --format '{{.Names}}' 2>/dev/null | grep '^supabase_' || true)"
          if [ -z "$containers" ]; then
            echo "No ephemeral Supabase containers exist; skipping stop."
            exit 0
          fi
          ./node_modules/.bin/supabase stop --workdir apps/web --no-backup > artifacts/ci/supabase-stop.log 2>&1

      - name: Remove isolated Supabase Docker network
        if: always()
        run: |
          network_name="${{ steps.supabase_network.outputs.network_name }}"
          if [ -z "$network_name" ]; then
            echo "No isolated Supabase Docker network was created; skipping removal."
            exit 0
          fi
          if ! docker network inspect "$network_name" >/dev/null 2>&1; then
            echo "Isolated Supabase Docker network is already absent; skipping removal."
            exit 0
          fi
          docker network rm "$network_name"

      - name: Remove ephemeral credentials
        if: always()
        run: |
          rm -f apps/web/.env.local

      - name: Stage safe public E2E evidence
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.persistent_e2e.outcome }}
          SPOGOMI_OUTCOME: ${{ steps.spogomi_integration.outcome }}
          E2E_SELECTION_REASON: ${{ needs.plan.outputs.reason }}
          E2E_PLAYWRIGHT_PROJECTS: ${{ needs.plan.outputs.playwright_projects }}
        run: node scripts/checks/stage-public-e2e-artifact.mjs

      - name: Validate safe public E2E evidence
        id: validate_public_e2e
        if: always()
        run: node scripts/checks/check-public-e2e-artifact.mjs artifacts/ci-public-evidence

      - name: Upload safe public E2E evidence
        if: always() && steps.validate_public_e2e.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cleanmymap-public-e2e-evidence
          path: artifacts/ci-public-evidence
          if-no-files-found: error
          retention-days: 3

      - name: Upload redacted Supabase start diagnostic
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: supabase-start-diagnostic
          path: artifacts/ci/supabase-start-diagnostic.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Remove ephemeral Supabase logs
        if: always()
        run: |
          rm -f artifacts/ci/supabase-start.log artifacts/ci/supabase-reset.log artifacts/ci/supabase-stop.log
