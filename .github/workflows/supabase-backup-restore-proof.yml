name: supabase-backup-restore-proof

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/supabase-backup-restore-proof.yml"
      - ".github/workflows/supabase-backup.yml"
      - "apps/web/supabase/config.toml"
      - "apps/web/supabase/migrations/**"
      - "apps/web/supabase/seed.sql"
      - "scripts/ci/supabase-backup-restore-proof-fixture.sql"
      - "scripts/ci/supabase-restore-extension-preflight.sql"
      - "scripts/ci/verify-supabase-backup-relation-coherence.mjs"
      - "scripts/ci/classify-supabase-restore-failure.mjs"
      - "package.json"
      - "package-lock.json"

env:
  NODE_VERSION_FILE: apps/web/.nvmrc
  SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
  PROOF_NETWORK: cleanmymap-backup-proof-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  replay:
    name: Replay representative Supabase backup on ephemeral PostgreSQL
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PROOF_ROOT: ${{ runner.temp }}/cmm-supabase-backup-restore-proof
      PROOF_SOURCE_WORKDIR: ${{ runner.temp }}/cmm-supabase-backup-restore-proof-source
      PROOF_TARGET_WORKDIR: ${{ runner.temp }}/cmm-supabase-backup-restore-proof-target

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify Node runtime contract
        run: node scripts/checks/check-node-version-contract.mjs

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Reconstruct source, dump and replay into an identical target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROOF_ROOT/dumps" "$PROOF_SOURCE_WORKDIR/supabase" "$PROOF_TARGET_WORKDIR/supabase"
          cat > "$PROOF_TARGET_WORKDIR/supabase/config.toml" <<'EOF'
          project_id = "cmm-backup-proof-target"

          [api]
          enabled = false

          [db]
          port = 54332
          major_version = 17
          health_timeout = "2m"

          [db.migrations]
          enabled = false

          [db.seed]
          enabled = false

          [realtime]
          enabled = false

          [studio]
          enabled = false

          [inbucket]
          enabled = false

          [storage]
          enabled = false

          [imgproxy]
          enabled = false

          [analytics]
          enabled = false

          [edge_runtime]
          enabled = false
          EOF

          network_id="$(docker network create --driver bridge --label com.cleanmymap.ci=backup-restore-proof "$PROOF_NETWORK")"
          test -n "$network_id"
          ./node_modules/.bin/supabase start --workdir apps/web --yes --output-format json --network-id="$PROOF_NETWORK" > "$PROOF_ROOT/source-start.log" 2>&1
          ./node_modules/.bin/supabase db reset --local --workdir apps/web --yes --network-id="$PROOF_NETWORK" > "$PROOF_ROOT/source-reset.log" 2>&1
          source_container="supabase_db_web"
          test "$(docker ps --filter "name=^/${source_container}$" --format '{{.Names}}')" = "$source_container"
          docker cp scripts/ci/supabase-backup-restore-proof-fixture.sql "$source_container:/tmp/cmm-backup-restore-proof-fixture.sql"
          docker exec "$source_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -f /tmp/cmm-backup-restore-proof-fixture.sql > "$PROOF_ROOT/source-fixture.log" 2>&1

          ./node_modules/.bin/supabase db dump --local --workdir apps/web --role-only --file "$PROOF_ROOT/dumps/roles.sql" > "$PROOF_ROOT/dump-roles.log" 2>&1
          ./node_modules/.bin/supabase db dump --local --workdir apps/web --schema public --file "$PROOF_ROOT/dumps/schema.sql" > "$PROOF_ROOT/dump-schema.log" 2>&1
          ./node_modules/.bin/supabase db dump --local --workdir apps/web --data-only --schema public --use-copy --file "$PROOF_ROOT/dumps/data.sql" > "$PROOF_ROOT/dump-data.log" 2>&1
          test -s "$PROOF_ROOT/dumps/roles.sql"
          test -s "$PROOF_ROOT/dumps/schema.sql"
          test -s "$PROOF_ROOT/dumps/data.sql"

          ./node_modules/.bin/supabase start --workdir "$PROOF_TARGET_WORKDIR" --yes --output-format json --network-id="$PROOF_NETWORK" > "$PROOF_ROOT/target-start.log" 2>&1
          target_container="supabase_db_cmm-backup-proof-target"
          test "$(docker ps --filter "name=^/${target_container}$" --format '{{.Names}}')" = "$target_container"
          docker cp "$PROOF_ROOT/dumps/roles.sql" "$target_container:/tmp/cmm-roles.sql"
          docker cp "$PROOF_ROOT/dumps/schema.sql" "$target_container:/tmp/cmm-schema.sql"
          docker cp "$PROOF_ROOT/dumps/data.sql" "$target_container:/tmp/cmm-data.sql"
          docker cp scripts/ci/supabase-restore-extension-preflight.sql "$target_container:/tmp/cmm-restore-extension-preflight.sql"
          restore_db="postgres"
          docker exec "$target_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d "$restore_db" -c "alter default privileges in schema public revoke all on tables from anon, authenticated;"

          run_stage() {
            local stage="$1"
            local input="$2"
            local log="$PROOF_ROOT/restore-${stage}.log"
            local args=(-v ON_ERROR_STOP=1 -v VERBOSITY=verbose -U postgres -d "$restore_db")
            if [ "$stage" = "schema" ] || [ "$stage" = "data" ]; then
              args+=(-c "set search_path = public, extensions")
            fi
            if [ "$stage" = "data" ]; then
              args+=(-c "set session_replication_role = replica")
            fi
            args+=(-f "$input")
            set +e
            docker exec "$target_container" psql "${args[@]}" > "$log" 2>&1
            local exit_code=$?
            set -e
            local diagnostic
            diagnostic=$(node scripts/ci/classify-supabase-restore-failure.mjs --log "$log")
            echo "RESTORE_PROOF_SQL: stage=$stage exit_code=$exit_code $diagnostic"
            return "$exit_code"
          }

          printf 'create table public.cmm_backup_missing_extension_fixture (geom extensions.geometry);\n' > "$PROOF_ROOT/missing-extension.sql"
          docker cp "$PROOF_ROOT/missing-extension.sql" "$target_container:/tmp/cmm-missing-extension.sql"
          if docker exec "$target_container" psql -X -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -U postgres -d "$restore_db" -f /tmp/cmm-missing-extension.sql > "$PROOF_ROOT/missing-extension.log" 2>&1; then
            echo "Missing-extension proof unexpectedly passed; publication is refused."
            exit 1
          fi
          missing_count=$(docker exec "$target_container" psql -X -A -t -v ON_ERROR_STOP=1 -U postgres -d "$restore_db" -c "select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relname = 'cmm_backup_missing_extension_fixture';")
          test "$missing_count" = "0"

          run_stage roles /tmp/cmm-roles.sql
          run_stage extensions /tmp/cmm-restore-extension-preflight.sql
          run_stage schema /tmp/cmm-schema.sql
          docker exec "$target_container" psql -X -A -t -v ON_ERROR_STOP=1 -U postgres -d "$restore_db" -c "select n.nspname || '.' || c.relname from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relkind in ('r', 'p', 'S', 'v', 'm', 'f') order by 1;" > "$PROOF_ROOT/restore-relations.txt"
          node scripts/ci/verify-supabase-backup-relation-coherence.mjs --data-file "$PROOF_ROOT/dumps/data.sql" --available-file "$PROOF_ROOT/restore-relations.txt" --write-exported-file "$PROOF_ROOT/exported-relations.txt"

          docker exec "$target_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d "$restore_db" -c "create table public.cmm_backup_coherence_fixture (id integer primary key);"
          printf 'public.cmm_backup_coherence_fixture\n' > "$PROOF_ROOT/positive.relations.txt"
          printf 'COPY public.cmm_backup_coherence_fixture (id) FROM stdin;\n1\n\\.\n' > "$PROOF_ROOT/positive.data.sql"
          docker cp "$PROOF_ROOT/positive.data.sql" "$target_container:/tmp/cmm-positive.sql"
          docker exec "$target_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d "$restore_db" -f /tmp/cmm-positive.sql > "$PROOF_ROOT/positive.log" 2>&1
          node scripts/ci/verify-supabase-backup-relation-coherence.mjs --data-file "$PROOF_ROOT/positive.data.sql" --available-file "$PROOF_ROOT/positive.relations.txt"
          printf 'COPY public.cmm_backup_missing_fixture (id) FROM stdin;\n1\n\\.\n' > "$PROOF_ROOT/negative.data.sql"
          docker cp "$PROOF_ROOT/negative.data.sql" "$target_container:/tmp/cmm-negative.sql"
          if docker exec "$target_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d "$restore_db" -f /tmp/cmm-negative.sql > "$PROOF_ROOT/negative.log" 2>&1; then
            echo "Relation coherence PostgreSQL negative proof unexpectedly passed; publication is refused."
            exit 1
          fi
          if node scripts/ci/verify-supabase-backup-relation-coherence.mjs --data-file "$PROOF_ROOT/negative.data.sql" --available-file "$PROOF_ROOT/positive.relations.txt"; then
            echo "Relation coherence parser negative proof unexpectedly passed; publication is refused."
            exit 1
          fi
          docker exec "$target_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d "$restore_db" -c "drop table public.cmm_backup_coherence_fixture;"
          fixture_count=$(docker exec "$target_container" psql -X -A -t -v ON_ERROR_STOP=1 -U postgres -d "$restore_db" -c "select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relname = 'cmm_backup_coherence_fixture';")
          test "$fixture_count" = "0"

          run_stage data /tmp/cmm-data.sql
          cat > "$PROOF_ROOT/restore-checks.sql" <<'EOF'
          create temp table restore_business_relations (qualified_name text primary key);
          copy restore_business_relations (qualified_name) from stdin;
          EOF
          cat "$PROOF_ROOT/exported-relations.txt" >> "$PROOF_ROOT/restore-checks.sql"
          cat >> "$PROOF_ROOT/restore-checks.sql" <<'EOF'
          \.
          select
            (select count(*) = 1 from public.cmm_backup_restore_fixture where id = 1),
            (select count(*) > 0 from pg_constraint con join pg_class rel on rel.oid = con.conrelid join pg_namespace ns on ns.oid = rel.relnamespace where ns.nspname = 'public' and rel.relkind in ('r', 'p') and exists (select 1 from restore_business_relations r where r.qualified_name = 'public.' || rel.relname) and not exists (select 1 from pg_depend dep where dep.classid = 'pg_class'::regclass and dep.objid = rel.oid and dep.deptype = 'e')),
            (select count(*) > 0 from pg_proc where pronamespace = 'public'::regnamespace),
            (select count(*) > 0 from pg_class rel join pg_namespace ns on ns.oid = rel.relnamespace where ns.nspname = 'public' and rel.relkind in ('r', 'p') and rel.relrowsecurity and exists (select 1 from restore_business_relations r where r.qualified_name = 'public.' || rel.relname) and not exists (select 1 from pg_depend dep where dep.classid = 'pg_class'::regclass and dep.objid = rel.oid and dep.deptype = 'e')),
            (select count(*) >= 3 from pg_roles where rolname in ('anon', 'authenticated', 'service_role')),
            (select count(*) > 0 from information_schema.role_table_grants grant_info where grant_info.table_schema = 'public' and grant_info.grantee in ('anon', 'authenticated') and exists (select 1 from restore_business_relations r where r.qualified_name = 'public.' || grant_info.table_name) and not exists (select 1 from pg_depend dep join pg_class rel on rel.oid = dep.objid join pg_namespace ns on ns.oid = rel.relnamespace where dep.classid = 'pg_class'::regclass and dep.deptype = 'e' and ns.nspname = 'public' and rel.relname = grant_info.table_name)),
            (select count(*) > 0 from pg_extension where extname in ('pgcrypto', 'pg_trgm', 'uuid-ossp', 'postgis')),
            (select not exists (select 1 from restore_business_relations r join pg_class rel on r.qualified_name = 'public.' || rel.relname join pg_namespace ns on ns.oid = rel.relnamespace where ns.nspname = 'public' and exists (select 1 from pg_depend dep where dep.classid = 'pg_class'::regclass and dep.objid = rel.oid and dep.deptype = 'e'))),
            (select count(*) > 0 from pg_index index_info join pg_class rel on rel.oid = index_info.indrelid join pg_namespace ns on ns.oid = rel.relnamespace join pg_opclass opclass on opclass.oid = any (index_info.indclass::oid[]) join pg_namespace opclass_namespace on opclass_namespace.oid = opclass.opcnamespace where ns.nspname = 'public' and opclass_namespace.nspname = 'extensions' and opclass.opcname = 'gist_geometry_ops_2d' and exists (select 1 from restore_business_relations r where r.qualified_name = 'public.' || rel.relname)),
            (select count(*) >= 2 from pg_index index_info join pg_class rel on rel.oid = index_info.indrelid join pg_namespace ns on ns.oid = rel.relnamespace join pg_opclass opclass on opclass.oid = any (index_info.indclass::oid[]) join pg_namespace opclass_namespace on opclass_namespace.oid = opclass.opcnamespace where ns.nspname = 'public' and opclass_namespace.nspname = 'extensions' and opclass.opcname = 'gin_trgm_ops' and exists (select 1 from restore_business_relations r where r.qualified_name = 'public.' || rel.relname)),
            (select not exists (select 1 from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relname = 'cmm_backup_coherence_fixture'));
          EOF
          docker cp "$PROOF_ROOT/restore-checks.sql" "$target_container:/tmp/cmm-restore-checks.sql"
          docker exec "$target_container" psql -X -A -t -F '|' -v ON_ERROR_STOP=1 -U postgres -d "$restore_db" -f /tmp/cmm-restore-checks.sql > "$PROOF_ROOT/restore-checks.txt"
          grep -qx 't|t|t|t|t|t|t|t|t|t|t' "$PROOF_ROOT/restore-checks.txt"
          echo "EPHEMERAL_BACKUP_RESTORE_PROOF: PASS source=migrations dump=roles,schema,data target=isolated extensions=verified negative=verified"

      - name: Summarize non-sensitive proof
        if: always()
        run: |
          {
            echo "## Supabase backup restore proof"
            echo "- Commit: $GITHUB_SHA"
            echo "- Production writes: NONE"
            echo "- Source: canonical migrations and synthetic fixture only"
            echo "- Target: isolated ephemeral Supabase PostgreSQL"
            echo "- SQL/data diagnostics: private temporary files only; no artifact publication"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop ephemeral services and remove private diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          ./node_modules/.bin/supabase stop --workdir apps/web --no-backup >/dev/null 2>&1
          ./node_modules/.bin/supabase stop --workdir "$PROOF_TARGET_WORKDIR" --no-backup >/dev/null 2>&1
          docker network rm "$PROOF_NETWORK" >/dev/null 2>&1
          rm -rf "$PROOF_ROOT" "$PROOF_SOURCE_WORKDIR" "$PROOF_TARGET_WORKDIR"
