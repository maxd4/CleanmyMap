name: supabase-backup-restore-proof

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/supabase-backup-restore-proof.yml"
      - ".github/workflows/supabase-backup.yml"
      - "apps/web/supabase/config.toml"
      - "apps/web/supabase/migrations/**"
      - "apps/web/supabase/seed.sql"
      - "scripts/ci/supabase-backup-restore-proof-fixture.sql"
      - "scripts/ci/supabase-restore-extension-preflight.sql"
      - "scripts/ci/verify-supabase-backup-relation-coherence.mjs"
      - "scripts/ci/classify-supabase-restore-failure.mjs"
      - "scripts/ci/prepare-supabase-restore-roles.mjs"
      - "scripts/ci/prepare-supabase-restore-target.mjs"
      - "scripts/ci/run-supabase-restore-check.sh"
      - "package.json"
      - "package-lock.json"

env:
  NODE_VERSION_FILE: apps/web/.nvmrc
  SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io

jobs:
  replay:
    name: Replay representative Supabase backup on ephemeral PostgreSQL
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify Node runtime contract
        run: node scripts/checks/check-node-version-contract.mjs

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Reconstruct source, dump and replay into an identical target
        shell: bash
        run: |
          set -euo pipefail
          PROOF_ROOT="$RUNNER_TEMP/cmm-supabase-backup-restore-proof"
          PROOF_SOURCE_WORKDIR="$RUNNER_TEMP/cmm-supabase-backup-restore-proof-source"
          PROOF_TARGET_WORKDIR="$RUNNER_TEMP/cmm-supabase-backup-restore-proof-target"
          PROOF_NETWORK="cleanmymap-backup-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          proof_step="initialization"
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "EPHEMERAL_BACKUP_RESTORE_PROOF: FAIL step=$proof_step"; fi' EXIT
          mkdir -p "$PROOF_ROOT/dumps" "$PROOF_SOURCE_WORKDIR/supabase" "$PROOF_TARGET_WORKDIR/supabase"
          node scripts/ci/prepare-supabase-restore-target.mjs \
            --source-config=apps/web/supabase/config.toml \
            --target-config="$PROOF_TARGET_WORKDIR/supabase/config.toml" \
            --project-id=cmm-backup-proof-target \
            --port-offset=100

          proof_step="source-start"
          network_id="$(docker network create --driver bridge --label com.cleanmymap.ci=backup-restore-proof "$PROOF_NETWORK")"
          test -n "$network_id"
          ./node_modules/.bin/supabase start --workdir apps/web --yes --output-format json --network-id="$PROOF_NETWORK" > "$PROOF_ROOT/source-start.log" 2>&1
          echo "EPHEMERAL_BACKUP_RESTORE_PROOF: phase=source-start PASS"
          proof_step="source-reset"
          ./node_modules/.bin/supabase db reset --local --workdir apps/web --yes --network-id="$PROOF_NETWORK" > "$PROOF_ROOT/source-reset.log" 2>&1
          echo "EPHEMERAL_BACKUP_RESTORE_PROOF: phase=source-reset PASS"
          proof_step="source-fixture"
          source_container="supabase_db_web"
          test "$(docker ps --filter "name=^/${source_container}$" --format '{{.Names}}')" = "$source_container"
          docker cp scripts/ci/supabase-backup-restore-proof-fixture.sql "$source_container:/tmp/cmm-backup-restore-proof-fixture.sql"
          docker exec "$source_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -f /tmp/cmm-backup-restore-proof-fixture.sql > "$PROOF_ROOT/source-fixture.log" 2>&1
          echo "EPHEMERAL_BACKUP_RESTORE_PROOF: phase=source-fixture PASS"

          proof_step="source-dumps"
          ./node_modules/.bin/supabase db dump --local --workdir apps/web --role-only --file "$PROOF_ROOT/dumps/roles.sql" > "$PROOF_ROOT/dump-roles.log" 2>&1
          ./node_modules/.bin/supabase db dump --local --workdir apps/web --schema public --file "$PROOF_ROOT/dumps/schema.sql" > "$PROOF_ROOT/dump-schema.log" 2>&1
          ./node_modules/.bin/supabase db dump --local --workdir apps/web --data-only --schema public --use-copy --file "$PROOF_ROOT/dumps/data.sql" > "$PROOF_ROOT/dump-data.log" 2>&1
          test -s "$PROOF_ROOT/dumps/roles.sql"
          test -s "$PROOF_ROOT/dumps/schema.sql"
          test -s "$PROOF_ROOT/dumps/data.sql"
          echo "EPHEMERAL_BACKUP_RESTORE_PROOF: phase=source-dumps PASS"

          proof_step="target-start"
          target_start_started_at="$(date +%s)"
          set +e
          ./node_modules/.bin/supabase start --workdir "$PROOF_TARGET_WORKDIR" --yes --output-format json --network-id="$PROOF_NETWORK" > "$PROOF_ROOT/target-start.log" 2>&1
          target_start_exit_code=$?
          set -e
          if [ "$target_start_exit_code" -ne 0 ]; then
            target_start_duration_seconds=$(( $(date +%s) - target_start_started_at ))
            node scripts/ci/diagnose-supabase-start.mjs \
              --log-file="$PROOF_ROOT/target-start.log" \
              --exit-code="$target_start_exit_code" \
              --duration-seconds="$target_start_duration_seconds" \
              > "$PROOF_ROOT/target-start-diagnostic.txt" 2>&1 || true
            cat "$PROOF_ROOT/target-start-diagnostic.txt"
            exit "$target_start_exit_code"
          fi
          echo "EPHEMERAL_BACKUP_RESTORE_PROOF: phase=target-start PASS"
          proof_step="target-prepare"
          target_container="supabase_db_cmm-backup-proof-target"
          test "$(docker ps --filter "name=^/${target_container}$" --format '{{.Names}}')" = "$target_container"
          restore_db="postgres"
          proof_step="restore-check"
          export RESTORE_CHECK_ROOT="$PROOF_ROOT"
          export RESTORE_CHECK_CONTAINER="$target_container"
          export RESTORE_CHECK_DATABASE="$restore_db"
          export RESTORE_CHECK_ROLES_FILE="$PROOF_ROOT/dumps/roles.sql"
          export RESTORE_CHECK_SCHEMA_FILE="$PROOF_ROOT/dumps/schema.sql"
          export RESTORE_CHECK_DATA_FILE="$PROOF_ROOT/dumps/data.sql"
          export RESTORE_CHECK_EXTENSION_PREFLIGHT_FILE="scripts/ci/supabase-restore-extension-preflight.sql"
          export RESTORE_CHECK_EXPECT_SYNTHETIC_FIXTURE=true
          bash scripts/ci/run-supabase-restore-check.sh

          echo "EPHEMERAL_BACKUP_RESTORE_PROOF: phase=restore-check PASS"
          echo "EPHEMERAL_BACKUP_RESTORE_PROOF: PASS source=migrations dump=roles,schema,data target=isolated extensions=verified negative=verified"

      - name: Summarize non-sensitive proof
        if: always()
        run: |
          {
            echo "## Supabase backup restore proof"
            echo "- Commit: $GITHUB_SHA"
            echo "- Production writes: NONE"
            echo "- Source: canonical migrations and synthetic fixture only"
            echo "- Target: isolated ephemeral Supabase PostgreSQL"
            echo "- SQL/data diagnostics: private temporary files only; no artifact publication"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop ephemeral services and remove private diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          proof_root="$RUNNER_TEMP/cmm-supabase-backup-restore-proof"
          proof_source_workdir="$RUNNER_TEMP/cmm-supabase-backup-restore-proof-source"
          proof_target_workdir="$RUNNER_TEMP/cmm-supabase-backup-restore-proof-target"
          proof_network="cleanmymap-backup-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ./node_modules/.bin/supabase stop --workdir apps/web --no-backup >/dev/null 2>&1
          ./node_modules/.bin/supabase stop --workdir "$proof_target_workdir" --no-backup >/dev/null 2>&1
          docker network rm "$proof_network" >/dev/null 2>&1
          rm -rf "$proof_root" "$proof_source_workdir" "$proof_target_workdir"
