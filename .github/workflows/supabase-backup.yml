name: Supabase encrypted backup

permissions: {}

concurrency:
  group: supabase-production-backup
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BACKUP_PRODUCTION_NOW to authorize this read-only export
        required: true
        type: string
  schedule:
    - cron: "17 2 1 * *"

env:
  NODE_VERSION_FILE: apps/web/.nvmrc
  SUPABASE_PROJECT_REF: trktzkgujgpgsgkoyndn
  BACKUP_CONFIRMATION: BACKUP_PRODUCTION_NOW

jobs:
  backup:
    name: Export, encrypt, verify, and retain Supabase backup
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.confirmation == 'BACKUP_PRODUCTION_NOW') ||
      (github.event_name == 'schedule' && vars.SUPABASE_BACKUP_MONTHLY_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: supabase-production
    permissions:
      contents: read

    steps:
      - name: Checkout the requested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Prepare isolated backup workspace and verify recipient key
        id: prepare
        env:
          SUPABASE_BACKUP_GPG_PUBLIC_KEY: ${{ secrets.SUPABASE_BACKUP_GPG_PUBLIC_KEY }}
          SUPABASE_BACKUP_GPG_EXPECTED_FINGERPRINT: ${{ vars.SUPABASE_BACKUP_GPG_EXPECTED_FINGERPRINT }}
        run: |
          set -euo pipefail
          for required in SUPABASE_BACKUP_GPG_PUBLIC_KEY SUPABASE_BACKUP_GPG_EXPECTED_FINGERPRINT; do
            if [ -z "${!required:-}" ]; then
              echo "$required is missing from the protected supabase-production environment. No export was started."
              exit 1
            fi
          done
          backup_root="$RUNNER_TEMP/cmm-supabase-backup"
          gnupg_home="$RUNNER_TEMP/cmm-supabase-backup-gnupg"
          key_file="$RUNNER_TEMP/cmm-supabase-backup-public-key.asc"
          mkdir -p "$backup_root/database" "$backup_root/storage" "$backup_root/metadata" "$gnupg_home"
          chmod 700 "$backup_root" "$gnupg_home"
          printf '%s' "$SUPABASE_BACKUP_GPG_PUBLIC_KEY" > "$key_file"
          if ! fingerprint=$(node scripts/ci/verify-supabase-backup-gpg.mjs \
            --key "$key_file" \
            --expected "$SUPABASE_BACKUP_GPG_EXPECTED_FINGERPRINT" \
            --gnupg-home "$gnupg_home"); then
            echo "The configured GPG public key is unusable or does not match the protected expected fingerprint. No export was started."
            exit 1
          fi
          rm -f "$key_file"
          {
            echo "BACKUP_ROOT=$backup_root"
            echo "GNUPGHOME=$gnupg_home"
            echo "RECIPIENT_FINGERPRINT=$fingerprint"
          } >> "$GITHUB_ENV"
          echo "recipient_fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Link the protected Supabase project without printing CLI output
        working-directory: apps/web
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "The protected Supabase access and database credentials are required. No export was started."
            exit 1
          fi
          if ! npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" > "$RUNNER_TEMP/supabase-link.log" 2>&1; then
            echo "Supabase link failed; its protected diagnostic was discarded. No backup artifact was produced."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/supabase-link.log"

      - name: Export roles, schema, business data, and migration inventory
        working-directory: apps/web
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          cli_version=$(npx supabase --version | head -n 1)
          printf '%s\n' "$cli_version" > "$BACKUP_ROOT/metadata/supabase-cli-version.txt"
          npx supabase db dump --linked --role-only --file "$BACKUP_ROOT/database/roles.sql"
          npx supabase db dump --linked --schema public,private --file "$BACKUP_ROOT/database/schema.sql"
          npx supabase db dump --linked --data-only --schema public,private --use-copy --file "$BACKUP_ROOT/database/data.sql"
          npx supabase migration list --linked > "$BACKUP_ROOT/metadata/migration-list.txt"
          for file in "$BACKUP_ROOT/database/roles.sql" "$BACKUP_ROOT/database/schema.sql" "$BACKUP_ROOT/database/data.sql" "$BACKUP_ROOT/metadata/migration-list.txt"; do
            test -s "$file"
          done
          grep -Eq '(^|[[:space:]])(CREATE|ALTER|GRANT|REVOKE)[[:space:]]+(ROLE|USER|GROUP|DEFAULT)' "$BACKUP_ROOT/database/roles.sql"

      - name: Export Storage objects through the official read-only API
        env:
          SUPABASE_URL: https://${{ env.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_STORAGE_READ_KEY: ${{ secrets.SUPABASE_BACKUP_STORAGE_READ_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_STORAGE_READ_KEY:-}" ]; then
            echo "SUPABASE_BACKUP_STORAGE_READ_KEY is missing from the protected environment. No backup artifact was produced."
            exit 1
          fi
          node scripts/ci/export-supabase-storage.mjs --out "$BACKUP_ROOT/storage"

      - name: Build hash manifest with explicit coverage limits
        run: |
          set -euo pipefail
          node scripts/ci/build-supabase-backup-manifest.mjs \
            --root "$BACKUP_ROOT" \
            --out "$BACKUP_ROOT/manifest.json" \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --git-sha "$GITHUB_SHA" \
            --cli-version "$(head -n 1 "$BACKUP_ROOT/metadata/supabase-cli-version.txt")" \
            --recipient-fingerprint "$RECIPIENT_FINGERPRINT"

      - name: Verify backup manifest integrity before restore and encryption
        run: |
          set -euo pipefail
          node scripts/ci/verify-supabase-backup-manifest.mjs \
            --root "$BACKUP_ROOT" \
            --manifest "$BACKUP_ROOT/manifest.json"

      - name: Restore-check schema and data on isolated ephemeral PostgreSQL
        id: restore
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          export SUPABASE_DB_PASSWORD='ephemeral-restore-not-production'
          restore_workdir="$RUNNER_TEMP/cmm-supabase-restore"
          restore_output="$RUNNER_TEMP/restore-check-output.log"
          restore_status=RESTORE_FAILED
          restore_exit=1
          mkdir -p "$restore_workdir/supabase"
          if node scripts/ci/prepare-supabase-restore-target.mjs \
            --source-config=apps/web/supabase/config.toml \
            --target-config="$restore_workdir/supabase/config.toml" \
            --project-id=cmm-backup-restore \
            --port-offset=100 && \
            npx supabase start --workdir "$restore_workdir" --yes > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            db_container="supabase_db_cmm-backup-restore"
            if [ "$(docker ps --filter "name=^/${db_container}$" --format '{{.Names}}')" = "$db_container" ]; then
              restore_db="postgres"
              export RESTORE_CHECK_ROOT="$RUNNER_TEMP/cmm-supabase-restore"
              export RESTORE_CHECK_CONTAINER="$db_container"
              export RESTORE_CHECK_DATABASE="$restore_db"
              export RESTORE_CHECK_ROLES_FILE="$BACKUP_ROOT/database/roles.sql"
              export RESTORE_CHECK_SCHEMA_FILE="$BACKUP_ROOT/database/schema.sql"
              export RESTORE_CHECK_DATA_FILE="$BACKUP_ROOT/database/data.sql"
              export RESTORE_CHECK_EXTENSION_PREFLIGHT_FILE="scripts/ci/supabase-restore-extension-preflight.sql"
              export RESTORE_CHECK_EXPECT_SYNTHETIC_FIXTURE=false
              set +e
              bash scripts/ci/run-supabase-restore-check.sh > "$restore_output" 2>&1
              restore_exit=$?
              set -e
            fi
          else
            restore_exit=$?
          fi
          if [ "$restore_exit" -eq 0 ]; then
            restore_status=RESTORE_VERIFIED
            echo "RESTORE_VERIFIED: checks=executed diagnostics=private"
          else
            echo "RESTORE_FAILED: checks=failed diagnostics=private"
            if [ -f "$restore_output" ]; then
              grep -E '^(RESTORE_ADMIN_PRIVILEGES:|RESTORE_SQL:|RESTORE_RELATION_COHERENCE:|SUPABASE_RESTORE_CHECK:)' "$restore_output" || true
            fi
          fi
          echo "RESTORE_STATUS=$restore_status" >> "$GITHUB_ENV"
          echo "restore_status=$restore_status" >> "$GITHUB_OUTPUT"

      - name: Encrypt the complete backup before artifact publication
        id: encrypt
        run: |
          set -euo pipefail
          plain_archive="$RUNNER_TEMP/supabase-backup.tar"
          encrypted_archive="$RUNNER_TEMP/supabase-backup-${GITHUB_RUN_ID}.tar.gpg"
          tar --create --file "$plain_archive" --directory "$BACKUP_ROOT" .
          GNUPGHOME="$GNUPGHOME" gpg --batch --yes --trust-model always --recipient "$RECIPIENT_FINGERPRINT" --output "$encrypted_archive" --encrypt "$plain_archive"
          gpg --batch --list-only --list-packets "$encrypted_archive" 2>/dev/null | grep -q ':pubkey enc packet:'
          archive_sha256=$(sha256sum "$encrypted_archive" | awk '{print $1}')
          printf '%s  %s\n' "$archive_sha256" "$(basename "$encrypted_archive")" > "$RUNNER_TEMP/supabase-backup-${GITHUB_RUN_ID}.sha256"
          rm -f "$plain_archive"
          echo "encrypted_archive=$encrypted_archive" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"

      - name: Publish encrypted backup to private Cloudflare R2 and verify retrieval
        id: r2
        env:
          SUPABASE_BACKUP_R2_ENDPOINT: ${{ vars.SUPABASE_BACKUP_R2_ENDPOINT }}
          SUPABASE_BACKUP_R2_BUCKET: ${{ vars.SUPABASE_BACKUP_R2_BUCKET }}
          SUPABASE_BACKUP_R2_OBJECT_PREFIX: ${{ vars.SUPABASE_BACKUP_R2_OBJECT_PREFIX }}
          SUPABASE_BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.SUPABASE_BACKUP_R2_ACCESS_KEY_ID }}
          SUPABASE_BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_BACKUP_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          for required in SUPABASE_BACKUP_R2_ENDPOINT SUPABASE_BACKUP_R2_BUCKET SUPABASE_BACKUP_R2_ACCESS_KEY_ID SUPABASE_BACKUP_R2_SECRET_ACCESS_KEY; do
            if [ -z "${!required:-}" ]; then
              echo "$required is missing from the protected supabase-production environment. No R2 publication was attempted."
              exit 1
            fi
          done
          object_prefix="${SUPABASE_BACKUP_R2_OBJECT_PREFIX:-supabase-backups}"
          if [[ "$object_prefix" =~ [^A-Za-z0-9._/-] || "$object_prefix" = /* || "$object_prefix" = */ ]]; then
            echo "SUPABASE_BACKUP_R2_OBJECT_PREFIX is invalid. No R2 publication was attempted."
            exit 1
          fi
          export SUPABASE_BACKUP_R2_OBJECT_KEY="${object_prefix%/}/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gpg"
          node scripts/ci/publish-supabase-backup-r2.mjs \
            --archive "$RUNNER_TEMP/supabase-backup-${GITHUB_RUN_ID}.tar.gpg" \
            --checksum "$RUNNER_TEMP/supabase-backup-${GITHUB_RUN_ID}.sha256"
          echo "BACKUP_STATUS=BACKUP_CREATED" >> "$GITHUB_ENV"
          echo "backup_status=BACKUP_CREATED" >> "$GITHUB_OUTPUT"

      - name: Publish encrypted artifact only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: supabase-encrypted-backup-${{ github.run_id }}
          path: |
            ${{ steps.encrypt.outputs.encrypted_archive }}
            ${{ runner.temp }}/supabase-backup-${{ github.run_id }}.sha256
          if-no-files-found: error
          retention-days: 3

      - name: Summarize the non-sensitive proof
        if: always()
        run: |
          archive_sha256="${{ steps.encrypt.outputs.archive_sha256 || '' }}"
          backup_status="${BACKUP_STATUS:-BACKUP_FAILED}"
          restore_status="${RESTORE_STATUS:-RESTORE_FAILED}"
          {
            echo "## Supabase encrypted backup"
            printf '%s\n' "- Project: $SUPABASE_PROJECT_REF"
            printf '%s\n' "- Commit: $GITHUB_SHA"
            printf '%s\n' "- Recipient fingerprint: $RECIPIENT_FINGERPRINT"
            printf '%s\n' "- Archive SHA-256: ${archive_sha256:-NOT_PRODUCED}"
            printf '%s\n' "- Backup status: $backup_status"
            printf '%s\n' "- Restore status: $restore_status"
            printf '%s\n' "- R2 retrieval verification: exact SHA-256 required"
            echo "- Plaintext publication: NONE"
            echo "- Production writes: NONE"
            echo "- Auth platform records and managed service configuration: NOT_INCLUDED"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop ephemeral services and remove all temporary plaintext
        if: always()
        run: |
          set +e
          npx supabase stop --workdir "${restore_workdir:-$RUNNER_TEMP/cmm-supabase-restore}" --no-backup >/dev/null 2>&1
          rm -rf "$BACKUP_ROOT" "$GNUPGHOME" "${restore_workdir:-$RUNNER_TEMP/cmm-supabase-restore}" "$RUNNER_TEMP/supabase-backup.tar" "$RUNNER_TEMP/supabase-backup-public-key.asc" "$RUNNER_TEMP/supabase-link.log" "$RUNNER_TEMP/restore-check-output.log" "$RUNNER_TEMP/restore-roles.log" "$RUNNER_TEMP/restore-extensions.log" "$RUNNER_TEMP/restore-schema.log" "$RUNNER_TEMP/restore-data.log" "$RUNNER_TEMP/restore-checks.txt" "$RUNNER_TEMP/restore-checks.sql" "$RUNNER_TEMP/restore-relations.txt" "$RUNNER_TEMP/restore-exported-relations.txt" "$RUNNER_TEMP/missing-extension.sql" "$RUNNER_TEMP/missing-extension.log" "$RUNNER_TEMP/relation-coherence-positive.data.sql" "$RUNNER_TEMP/relation-coherence-positive.relations.txt" "$RUNNER_TEMP/relation-coherence-positive.log" "$RUNNER_TEMP/relation-coherence-negative.data.sql" "$RUNNER_TEMP/relation-coherence-negative.log" "$RUNNER_TEMP/supabase-start.log" "$RUNNER_TEMP/supabase-backup-${GITHUB_RUN_ID}.tar.gpg" "$RUNNER_TEMP/supabase-backup-${GITHUB_RUN_ID}.sha256"
