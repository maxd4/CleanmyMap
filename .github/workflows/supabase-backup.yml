name: Supabase encrypted backup

permissions: {}

concurrency:
  group: supabase-production-backup
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BACKUP_PRODUCTION_NOW to authorize this read-only export
        required: true
        type: string

env:
  NODE_VERSION_FILE: apps/web/.nvmrc
  SUPABASE_PROJECT_REF: trktzkgujgpgsgkoyndn
  BACKUP_CONFIRMATION: BACKUP_PRODUCTION_NOW

jobs:
  backup:
    name: Export, encrypt, and restore-check Supabase
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'BACKUP_PRODUCTION_NOW'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: supabase-production
    permissions:
      contents: read

    steps:
      - name: Checkout the requested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Prepare isolated backup workspace and verify recipient key
        id: prepare
        env:
          SUPABASE_BACKUP_GPG_PUBLIC_KEY: ${{ secrets.SUPABASE_BACKUP_GPG_PUBLIC_KEY }}
          SUPABASE_BACKUP_GPG_EXPECTED_FINGERPRINT: ${{ vars.SUPABASE_BACKUP_GPG_EXPECTED_FINGERPRINT }}
        run: |
          set -euo pipefail
          for required in SUPABASE_BACKUP_GPG_PUBLIC_KEY SUPABASE_BACKUP_GPG_EXPECTED_FINGERPRINT; do
            if [ -z "${!required:-}" ]; then
              echo "$required is missing from the protected supabase-production environment. No export was started."
              exit 1
            fi
          done
          backup_root="$RUNNER_TEMP/cmm-supabase-backup"
          gnupg_home="$RUNNER_TEMP/cmm-supabase-backup-gnupg"
          key_file="$RUNNER_TEMP/cmm-supabase-backup-public-key.asc"
          mkdir -p "$backup_root/database" "$backup_root/storage" "$backup_root/metadata" "$gnupg_home"
          chmod 700 "$backup_root" "$gnupg_home"
          printf '%s' "$SUPABASE_BACKUP_GPG_PUBLIC_KEY" > "$key_file"
          if ! fingerprint=$(node scripts/ci/verify-supabase-backup-gpg.mjs \
            --key "$key_file" \
            --expected "$SUPABASE_BACKUP_GPG_EXPECTED_FINGERPRINT" \
            --gnupg-home "$gnupg_home"); then
            echo "The configured GPG public key is unusable or does not match the protected expected fingerprint. No export was started."
            exit 1
          fi
          rm -f "$key_file"
          {
            echo "BACKUP_ROOT=$backup_root"
            echo "GNUPGHOME=$gnupg_home"
            echo "RECIPIENT_FINGERPRINT=$fingerprint"
          } >> "$GITHUB_ENV"
          echo "recipient_fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Link the protected Supabase project without printing CLI output
        working-directory: apps/web
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "The protected Supabase access and database credentials are required. No export was started."
            exit 1
          fi
          if ! npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" > "$RUNNER_TEMP/supabase-link.log" 2>&1; then
            echo "Supabase link failed; its protected diagnostic was discarded. No backup artifact was produced."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/supabase-link.log"

      - name: Export roles, schema, business data, and migration inventory
        working-directory: apps/web
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          cli_version=$(npx supabase --version | head -n 1)
          printf '%s\n' "$cli_version" > "$BACKUP_ROOT/metadata/supabase-cli-version.txt"
          npx supabase db dump --linked --role-only --file "$BACKUP_ROOT/database/roles.sql"
          npx supabase db dump --linked --schema public --file "$BACKUP_ROOT/database/schema.sql"
          npx supabase db dump --linked --data-only --schema public --use-copy --file "$BACKUP_ROOT/database/data.sql"
          npx supabase migration list --linked > "$BACKUP_ROOT/metadata/migration-list.txt"
          for file in "$BACKUP_ROOT/database/roles.sql" "$BACKUP_ROOT/database/schema.sql" "$BACKUP_ROOT/database/data.sql" "$BACKUP_ROOT/metadata/migration-list.txt"; do
            test -s "$file"
          done
          grep -Eq '(^|[[:space:]])(CREATE|ALTER|GRANT|REVOKE)[[:space:]]+(ROLE|USER|GROUP|DEFAULT)' "$BACKUP_ROOT/database/roles.sql"

      - name: Export Storage objects through the official read-only API
        env:
          SUPABASE_URL: https://${{ env.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_STORAGE_READ_KEY: ${{ secrets.SUPABASE_BACKUP_STORAGE_READ_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_STORAGE_READ_KEY:-}" ]; then
            echo "SUPABASE_BACKUP_STORAGE_READ_KEY is missing from the protected environment. No backup artifact was produced."
            exit 1
          fi
          node scripts/ci/export-supabase-storage.mjs --out "$BACKUP_ROOT/storage"

      - name: Build hash manifest with explicit coverage limits
        run: |
          set -euo pipefail
          node scripts/ci/build-supabase-backup-manifest.mjs \
            --root "$BACKUP_ROOT" \
            --out "$BACKUP_ROOT/manifest.json" \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --git-sha "$GITHUB_SHA" \
            --cli-version "$(head -n 1 "$BACKUP_ROOT/metadata/supabase-cli-version.txt")" \
            --recipient-fingerprint "$RECIPIENT_FINGERPRINT"

      - name: Verify backup manifest integrity before restore and encryption
        run: |
          set -euo pipefail
          node scripts/ci/verify-supabase-backup-manifest.mjs \
            --root "$BACKUP_ROOT" \
            --manifest "$BACKUP_ROOT/manifest.json"

      - name: Restore-check schema and data on isolated ephemeral PostgreSQL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          export SUPABASE_DB_PASSWORD='ephemeral-restore-not-production'
          restore_workdir="$RUNNER_TEMP/cmm-supabase-restore"
          mkdir -p "$restore_workdir/supabase"
          cat > "$restore_workdir/supabase/config.toml" <<'EOF'
          project_id = "cmm-backup-restore"

          [api]
          enabled = false

          [db]
          port = 54322
          major_version = 17
          health_timeout = "2m"

          [db.migrations]
          enabled = false

          [db.seed]
          enabled = false

          [realtime]
          enabled = false

          [studio]
          enabled = false

          [inbucket]
          enabled = false

          [storage]
          enabled = false

          [imgproxy]
          enabled = false

          [analytics]
          enabled = false

          [edge_runtime]
          enabled = false
          EOF
          npx supabase start --workdir "$restore_workdir" --yes > "$RUNNER_TEMP/supabase-start.log" 2>&1
          db_container="supabase_db_cmm-backup-restore"
          test "$(docker ps --filter "name=^/${db_container}$" --format '{{.Names}}')" = "$db_container"
          docker cp "$BACKUP_ROOT/database/schema.sql" "$db_container:/tmp/cmm-schema.sql"
          docker cp "$BACKUP_ROOT/database/data.sql" "$db_container:/tmp/cmm-data.sql"
          docker cp "$BACKUP_ROOT/database/roles.sql" "$db_container:/tmp/cmm-roles.sql"
          docker cp scripts/ci/supabase-restore-extension-preflight.sql "$db_container:/tmp/cmm-restore-extension-preflight.sql"
          restore_db="postgres"
          docker exec "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d "$restore_db" -c "alter default privileges in schema public revoke all on tables from anon, authenticated;"
          run_restore_stage() {
            local stage="$1"
            local input="$2"
            local log="$RUNNER_TEMP/restore-${stage}.log"
            local psql_args=(-v ON_ERROR_STOP=1 -v VERBOSITY=verbose -U postgres -d "$restore_db")
            if [ "$stage" = "schema" ] || [ "$stage" = "data" ]; then
              psql_args+=(-c "set search_path = public, extensions")
            fi
            if [ "$stage" = "data" ]; then
              psql_args+=(-c "set session_replication_role = replica")
            fi
            psql_args+=(-f "$input")
            set +e
            docker exec "$db_container" psql "${psql_args[@]}" > "$log" 2>&1
            local exit_code=$?
            set -e
            local diagnostic
            diagnostic=$(node scripts/ci/classify-supabase-restore-failure.mjs --log "$log")
            echo "RESTORE_SQL: stage=$stage exit_code=$exit_code $diagnostic"
            return "$exit_code"
          }
          printf 'create table public.cmm_backup_missing_extension_fixture (geom extensions.geometry);\n' > "$RUNNER_TEMP/missing-extension.sql"
          docker cp "$RUNNER_TEMP/missing-extension.sql" "$db_container:/tmp/cmm-missing-extension.sql"
          if docker exec "$db_container" psql -X -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -U postgres -d "$restore_db" -f /tmp/cmm-missing-extension.sql > "$RUNNER_TEMP/missing-extension.log" 2>&1; then
            echo "Missing-extension PostgreSQL negative fixture unexpectedly passed; publication is refused."
            exit 1
          fi
          missing_extension_fixture_count=$(docker exec "$db_container" psql -X -A -t -v ON_ERROR_STOP=1 -U postgres -d "$restore_db" -c "select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relname = 'cmm_backup_missing_extension_fixture';")
          test "$missing_extension_fixture_count" = "0"
          run_restore_stage roles /tmp/cmm-roles.sql
          run_restore_stage extensions /tmp/cmm-restore-extension-preflight.sql
          run_restore_stage schema /tmp/cmm-schema.sql
          docker exec "$db_container" psql -X -A -t -v ON_ERROR_STOP=1 -U postgres -d "$restore_db" -c "select n.nspname || '.' || c.relname from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relkind in ('r', 'p', 'S', 'v', 'm', 'f') order by 1;" > "$RUNNER_TEMP/restore-relations.txt"
          node scripts/ci/verify-supabase-backup-relation-coherence.mjs --data-file "$BACKUP_ROOT/database/data.sql" --available-file "$RUNNER_TEMP/restore-relations.txt" --write-exported-file "$RUNNER_TEMP/restore-exported-relations.txt"
          docker exec "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d "$restore_db" -c "create table public.cmm_backup_coherence_fixture (id integer primary key);"
          printf 'public.cmm_backup_coherence_fixture\n' > "$RUNNER_TEMP/relation-coherence-positive.relations.txt"
          printf 'COPY public.cmm_backup_coherence_fixture (id) FROM stdin;\n1\n\\.\n' > "$RUNNER_TEMP/relation-coherence-positive.data.sql"
          docker cp "$RUNNER_TEMP/relation-coherence-positive.data.sql" "$db_container:/tmp/cmm-relation-coherence-positive.sql"
          docker exec "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d "$restore_db" -f /tmp/cmm-relation-coherence-positive.sql > "$RUNNER_TEMP/relation-coherence-positive.log" 2>&1
          node scripts/ci/verify-supabase-backup-relation-coherence.mjs --data-file "$RUNNER_TEMP/relation-coherence-positive.data.sql" --available-file "$RUNNER_TEMP/relation-coherence-positive.relations.txt"
          printf 'COPY public.cmm_backup_missing_fixture (id) FROM stdin;\n1\n\\.\n' > "$RUNNER_TEMP/relation-coherence-negative.data.sql"
          docker cp "$RUNNER_TEMP/relation-coherence-negative.data.sql" "$db_container:/tmp/cmm-relation-coherence-negative.sql"
          if docker exec "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d "$restore_db" -f /tmp/cmm-relation-coherence-negative.sql > "$RUNNER_TEMP/relation-coherence-negative.log" 2>&1; then
            echo "Relation coherence PostgreSQL negative fixture unexpectedly passed; publication is refused."
            exit 1
          fi
          if node scripts/ci/verify-supabase-backup-relation-coherence.mjs --data-file "$RUNNER_TEMP/relation-coherence-negative.data.sql" --available-file "$RUNNER_TEMP/relation-coherence-positive.relations.txt"; then
            echo "Relation coherence negative fixture unexpectedly passed; publication is refused."
            exit 1
          fi
          docker exec "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d "$restore_db" -c "drop table public.cmm_backup_coherence_fixture;"
          fixture_count=$(docker exec "$db_container" psql -X -A -t -v ON_ERROR_STOP=1 -U postgres -d "$restore_db" -c "select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relname = 'cmm_backup_coherence_fixture';")
          test "$fixture_count" = "0"
          run_restore_stage data /tmp/cmm-data.sql
          cat > "$RUNNER_TEMP/restore-checks.sql" <<'EOF'
          create temp table restore_business_relations (qualified_name text primary key);
          copy restore_business_relations (qualified_name) from stdin;
          EOF
          cat "$RUNNER_TEMP/restore-exported-relations.txt" >> "$RUNNER_TEMP/restore-checks.sql"
          cat >> "$RUNNER_TEMP/restore-checks.sql" <<'EOF'
          \.
          select
            (select count(*) > 0 from pg_constraint con join pg_class rel on rel.oid = con.conrelid join pg_namespace ns on ns.oid = rel.relnamespace where ns.nspname = 'public' and rel.relkind in ('r', 'p') and exists (select 1 from restore_business_relations r where r.qualified_name = 'public.' || rel.relname) and not exists (select 1 from pg_depend dep where dep.classid = 'pg_class'::regclass and dep.objid = rel.oid and dep.deptype = 'e')),
            (select count(*) > 0 from pg_proc where pronamespace = 'public'::regnamespace),
            (select count(*) > 0 from pg_class rel join pg_namespace ns on ns.oid = rel.relnamespace where ns.nspname = 'public' and rel.relkind in ('r', 'p') and rel.relrowsecurity and exists (select 1 from restore_business_relations r where r.qualified_name = 'public.' || rel.relname) and not exists (select 1 from pg_depend dep where dep.classid = 'pg_class'::regclass and dep.objid = rel.oid and dep.deptype = 'e')),
            (select count(*) >= 3 from pg_roles where rolname in ('anon', 'authenticated', 'service_role')),
            (select count(*) > 0 from information_schema.role_table_grants grant_info where grant_info.table_schema = 'public' and grant_info.grantee in ('anon', 'authenticated') and exists (select 1 from restore_business_relations r where r.qualified_name = 'public.' || grant_info.table_name) and not exists (select 1 from pg_depend dep join pg_class rel on rel.oid = dep.objid join pg_namespace ns on ns.oid = rel.relnamespace where dep.classid = 'pg_class'::regclass and dep.deptype = 'e' and ns.nspname = 'public' and rel.relname = grant_info.table_name)),
            (select count(*) > 0 from pg_extension where extname in ('pgcrypto', 'pg_trgm', 'uuid-ossp', 'postgis')),
            (select not exists (select 1 from restore_business_relations r join pg_class rel on r.qualified_name = 'public.' || rel.relname join pg_namespace ns on ns.oid = rel.relnamespace where ns.nspname = 'public' and exists (select 1 from pg_depend dep where dep.classid = 'pg_class'::regclass and dep.objid = rel.oid and dep.deptype = 'e'))),
            (select count(*) > 0 from pg_index index_info join pg_class rel on rel.oid = index_info.indrelid join pg_namespace ns on ns.oid = rel.relnamespace join pg_opclass opclass on opclass.oid = any (index_info.indclass::oid[]) join pg_namespace opclass_namespace on opclass_namespace.oid = opclass.opcnamespace where ns.nspname = 'public' and opclass_namespace.nspname = 'extensions' and opclass.opcname = 'gist_geometry_ops_2d' and exists (select 1 from restore_business_relations r where r.qualified_name = 'public.' || rel.relname)),
            (select count(*) >= 2 from pg_index index_info join pg_class rel on rel.oid = index_info.indrelid join pg_namespace ns on ns.oid = rel.relnamespace join pg_opclass opclass on opclass.oid = any (index_info.indclass::oid[]) join pg_namespace opclass_namespace on opclass_namespace.oid = opclass.opcnamespace where ns.nspname = 'public' and opclass_namespace.nspname = 'extensions' and opclass.opcname = 'gin_trgm_ops' and exists (select 1 from restore_business_relations r where r.qualified_name = 'public.' || rel.relname));
          EOF
          docker cp "$RUNNER_TEMP/restore-checks.sql" "$db_container:/tmp/cmm-restore-checks.sql"
          docker exec "$db_container" psql -X -A -t -F '|' -v ON_ERROR_STOP=1 -U postgres -d "$restore_db" -f /tmp/cmm-restore-checks.sql > "$RUNNER_TEMP/restore-checks.txt"
          grep -qx 't|t|t|t|t|t|t|t|t' "$RUNNER_TEMP/restore-checks.txt"
          echo "EPHEMERAL_RESTORE: PASS roles=schema=data=executed constraints=checked functions=checked grants=checked rls=checked extensions=checked"

      - name: Encrypt the complete backup before artifact publication
        id: encrypt
        run: |
          set -euo pipefail
          plain_archive="$RUNNER_TEMP/supabase-backup.tar"
          encrypted_archive="$RUNNER_TEMP/supabase-backup-${GITHUB_RUN_ID}.tar.gpg"
          tar --create --file "$plain_archive" --directory "$BACKUP_ROOT" .
          GNUPGHOME="$GNUPGHOME" gpg --batch --yes --trust-model always --recipient "$RECIPIENT_FINGERPRINT" --output "$encrypted_archive" --encrypt "$plain_archive"
          gpg --batch --list-only --list-packets "$encrypted_archive" 2>/dev/null | grep -q ':pubkey enc packet:'
          archive_sha256=$(sha256sum "$encrypted_archive" | awk '{print $1}')
          printf '%s  %s\n' "$archive_sha256" "$(basename "$encrypted_archive")" > "$RUNNER_TEMP/supabase-backup-${GITHUB_RUN_ID}.sha256"
          rm -f "$plain_archive"
          echo "encrypted_archive=$encrypted_archive" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"

      - name: Publish encrypted artifact only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: supabase-encrypted-backup-${{ github.run_id }}
          path: |
            ${{ steps.encrypt.outputs.encrypted_archive }}
            ${{ runner.temp }}/supabase-backup-${{ github.run_id }}.sha256
          if-no-files-found: error
          retention-days: 3

      - name: Summarize the non-sensitive proof
        if: always()
        run: |
          archive_sha256="${{ steps.encrypt.outputs.archive_sha256 || '' }}"
          {
            echo "## Supabase encrypted backup"
            printf '%s\n' "- Project: $SUPABASE_PROJECT_REF"
            printf '%s\n' "- Commit: $GITHUB_SHA"
            printf '%s\n' "- Recipient fingerprint: $RECIPIENT_FINGERPRINT"
            printf '%s\n' "- Archive SHA-256: ${archive_sha256:-NOT_PRODUCED}"
            echo "- Plaintext publication: NONE"
            echo "- Production writes: NONE"
            echo "- Auth platform records and managed service configuration: NOT_INCLUDED"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop ephemeral services and remove all temporary plaintext
        if: always()
        run: |
          set +e
          npx supabase stop --workdir "${restore_workdir:-$RUNNER_TEMP/cmm-supabase-restore}" --no-backup >/dev/null 2>&1
          rm -rf "$BACKUP_ROOT" "$GNUPGHOME" "${restore_workdir:-$RUNNER_TEMP/cmm-supabase-restore}" "$RUNNER_TEMP/supabase-backup.tar" "$RUNNER_TEMP/supabase-backup-public-key.asc" "$RUNNER_TEMP/supabase-link.log" "$RUNNER_TEMP/restore-roles.log" "$RUNNER_TEMP/restore-extensions.log" "$RUNNER_TEMP/restore-schema.log" "$RUNNER_TEMP/restore-data.log" "$RUNNER_TEMP/restore-checks.txt" "$RUNNER_TEMP/restore-checks.sql" "$RUNNER_TEMP/restore-relations.txt" "$RUNNER_TEMP/restore-exported-relations.txt" "$RUNNER_TEMP/missing-extension.sql" "$RUNNER_TEMP/missing-extension.log" "$RUNNER_TEMP/relation-coherence-positive.data.sql" "$RUNNER_TEMP/relation-coherence-positive.relations.txt" "$RUNNER_TEMP/relation-coherence-positive.log" "$RUNNER_TEMP/relation-coherence-negative.data.sql" "$RUNNER_TEMP/relation-coherence-negative.log" "$RUNNER_TEMP/supabase-start.log"
