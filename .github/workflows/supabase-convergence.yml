name: Supabase migration convergence

permissions: {}

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

env:
  NODE_VERSION_FILE: apps/web/.nvmrc
  SUPABASE_PROJECT_REF: trktzkgujgpgsgkoyndn

jobs:
  monitor:
    name: Monitor read-only Supabase convergence
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: supabase-production
    permissions:
      contents: read

    steps:
      - name: Checkout trusted main control source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Link the verified Supabase project
        working-directory: apps/web
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "SUPABASE_DB_PASSWORD is required for the linked PostgreSQL read-only checks; configure the existing protected secret before retrying."
            exit 1
          fi
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Run read-only convergence preflight
        id: preflight
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set +e
          npm run supabase:migration:preflight -- --dry-run > "$RUNNER_TEMP/supabase-preflight.log" 2>&1
          preflight_exit=$?
          set -e
          cat "$RUNNER_TEMP/supabase-preflight.log"
          status=$(sed -n 's/^PREFLIGHT_STATUS: //p' "$RUNNER_TEMP/supabase-preflight.log" | tail -n 1)
          first=$(sed -n 's/^FIRST_BLOCKING_MIGRATION: //p' "$RUNNER_TEMP/supabase-preflight.log" | tail -n 1)
          action=$(sed -n 's/^ACTION_REQUIRED: //p' "$RUNNER_TEMP/supabase-preflight.log" | tail -n 1)
          pending_count=$(sed -n 's/^PENDING_MIGRATIONS: //p' "$RUNNER_TEMP/supabase-preflight.log" | tail -n 1)
          oldest_pending=$(sed -n 's/^PENDING: //p' "$RUNNER_TEMP/supabase-preflight.log" | head -n 1)
          oldest_pending=${oldest_pending:-NONE}
          oldest_age_days=NOT_APPLICABLE
          if [[ "$oldest_pending" =~ ^[0-9]{14}$ ]]; then
            oldest_date="${oldest_pending:0:4}-${oldest_pending:4:2}-${oldest_pending:6:2}"
            if oldest_epoch=$(date -u -d "$oldest_date" +%s 2>/dev/null); then
              now_epoch=$(date -u +%s)
              oldest_age_days=$(((now_epoch - oldest_epoch) / 86400))
              if (( oldest_age_days < 0 )); then oldest_age_days=0; fi
            else
              oldest_age_days=UNKNOWN
            fi
          fi
          {
            echo "## Supabase migration convergence (read-only)"
            echo "- Status: \`$status\`"
            echo "- Pending migrations: \`${pending_count:-UNKNOWN}\`"
            echo "- Oldest pending migration: \`$oldest_pending\` (\`${oldest_age_days}\` days)"
            echo "- First blocking migration: \`${first:-NONE}\`"
            echo "- Required action: ${action:-not reported}"
            echo "- Remote writes: \`NONE\` (canonical application via linked Supabase CLI)"
          } >> "$GITHUB_STEP_SUMMARY"
          node scripts/ci/supabase-convergence-postflight.mjs "$GITHUB_EVENT_NAME" "$status" "$preflight_exit"

      - name: Verify migration trees and critical SQL contracts
        run: |
          npm run audit:supabase-migration-trees
          node --test scripts/ci/supabase-migration-preflight.test.mjs scripts/audits/audit-supabase-migration-trees.test.mjs
          npm run test -w apps/web -- src/lib/supabase/migration-contracts/action-rides-transactions-migration.test.ts src/lib/supabase/migration-contracts/public-action-map-reconstruction-projection.test.ts
