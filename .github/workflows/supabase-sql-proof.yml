name: supabase-sql-proof-ephemeral

permissions: {}

concurrency:
  group: supabase-sql-proof-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'FULL') || github.event_name == 'schedule' && 'FULL' || 'DEVELOPMENT' }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Proof mode; isolation is read-only against Supabase and uses only an ephemeral runner database"
        required: true
        type: choice
        default: complete-proof
        options:
          - complete-proof
          - isolate-replay
      validation_mode:
        description: "DEVELOPMENT (proportionné au diff) ou FULL (toutes les preuves SQL)"
        required: true
        type: choice
        default: DEVELOPMENT
        options:
          - DEVELOPMENT
          - FULL
  push:
    branches:
      - main
    paths:
      - "apps/web/supabase/config.toml"
      - "apps/web/supabase/migrations/**"
      - "apps/web/supabase/seed.sql"
      - "apps/web/supabase/tests/**"
      - "e2e/*.sql"
      - "e2e/*-concurrency.mjs"
      - "e2e/security-02-two-sessions.mjs"
      - "scripts/ci/run-supabase-sql-proof.mjs"
      - "scripts/ci/run-supabase-sql-proof.test.mjs"
      - "scripts/ci/diagnose-supabase-start.mjs"
      - "scripts/ci/diagnose-supabase-start.test.mjs"
      - "scripts/ci/start-supabase-ephemeral.sh"
      - "scripts/ci/supabase-config.mjs"
      - "scripts/ci/supabase-config.test.mjs"
      - "scripts/ci/isolate-supabase-migration-failure.mjs"
      - "scripts/ci/isolate-supabase-migration-failure.test.mjs"
      - "scripts/ci/select-e2e-sql-plan.mjs"
      - "scripts/ci/ci-timing-report.mjs"
      - ".github/workflows/supabase-sql-proof.yml"
      - "package.json"
      - "package-lock.json"

env:
  NODE_VERSION_FILE: apps/web/.nvmrc
  SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io

jobs:
  plan:
    name: Plan proportionate SQL proof
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.select.outputs.docs_only }}
      sql_should_run: ${{ steps.select.outputs.sql_should_run }}
      sql_proof_targets: ${{ steps.select.outputs.sql_proof_targets }}
      validate_all_sql: ${{ steps.select.outputs.validate_all_sql }}
      reason: ${{ steps.select.outputs.reason }}
      inputs_digest: ${{ steps.select.outputs.inputs_digest }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}

      - name: Select proportionate SQL proof plan
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          VALIDATION_MODE: ${{ inputs.validation_mode }}
        run: node scripts/ci/select-e2e-sql-plan.mjs

  sql-proof:
    name: Replay and attest ephemeral SQL proof
    needs: plan
    if: needs.plan.outputs.sql_should_run == 'true' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') && (github.event_name != 'workflow_dispatch' || inputs.mode != 'isolate-replay')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify manual run targets current main
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$current_main_sha"
          test "$current_main_sha" = "$GITHUB_SHA"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify Node runtime contract
        run: node scripts/checks/check-node-version-contract.mjs

      - name: Restore Node modules cache
        id: node_modules_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            node_modules
            apps/web/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json', 'apps/web/.nvmrc') }}

      - name: Install Node dependencies
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Audit canonical migration tree and SQL syntax
        shell: bash
        run: |
          set -euo pipefail
          npm run audit:supabase-migration-trees
          if [[ "${{ needs.plan.outputs.validate_all_sql }}" == "true" ]]; then
            mapfile -t sql_files < <(find apps/web/supabase/migrations apps/web/supabase/tests e2e -type f -name '*.sql' -print | sort)
          else
            base_sha="${{ github.event.before }}"
            if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
              mapfile -t sql_files < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'apps/web/supabase/migrations/**/*.sql' 'apps/web/supabase/tests/**/*.sql' 'e2e/**/*.sql')
            else
              mapfile -t sql_files < <(git diff --name-only "$base_sha" "$GITHUB_SHA" -- 'apps/web/supabase/migrations/**/*.sql' 'apps/web/supabase/tests/**/*.sql' 'e2e/**/*.sql')
            fi
          fi
          args=(scripts/ci/validate-sql-syntax.mjs "--ref=$GITHUB_SHA")
          for file in "${sql_files[@]}"; do
            [[ -n "$file" ]] && args+=("--changed-file=$file")
          done
          node "${args[@]}"

      - name: Verify canonical ephemeral inputs
        run: test -d apps/web/supabase/migrations && test -f apps/web/supabase/seed.sql

      - name: Initialize SHA-bound SQL evidence
        env:
          CMM_SUPABASE_CANDIDATE_SHA: ${{ github.sha }}
        run: node scripts/ci/run-supabase-sql-proof.mjs --initialize-workflow-evidence

      - name: Prepare isolated Supabase Docker network
        id: supabase_network
        run: |
          set -euo pipefail
          network_name="cleanmymap-sql-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker network create --driver bridge --label com.cleanmymap.ci=ephemeral "$network_name"
          echo "network_name=$network_name" >> "$GITHUB_OUTPUT"

      - name: Start ephemeral Supabase
        id: start_supabase
        run: |
          mkdir -p artifacts/ci
          bash scripts/ci/start-supabase-ephemeral.sh apps/web "${{ steps.supabase_network.outputs.network_name }}" artifacts/ci/supabase-start-diagnostic.txt

      - name: Apply canonical migrations and seed
        id: apply_reset
        env:
          CMM_SUPABASE_CANDIDATE_SHA: ${{ github.sha }}
          CMM_SUPABASE_TEST_ENVIRONMENT: ephemeral
          CMM_SUPABASE_EPHEMERAL_TEST_AUTHORIZATION: I_UNDERSTAND_EPHEMERAL_ONLY
          CMM_SUPABASE_NETWORK_ID: ${{ steps.supabase_network.outputs.network_name }}
        run: node scripts/ci/run-supabase-sql-proof.mjs --reset-canonical-db

      - name: Verify canonical ephemeral schema and seed
        id: verify_schema_seed
        env:
          CMM_SUPABASE_CANDIDATE_SHA: ${{ github.sha }}
          CMM_SUPABASE_TEST_ENVIRONMENT: ephemeral
          CMM_SUPABASE_EPHEMERAL_TEST_AUTHORIZATION: I_UNDERSTAND_EPHEMERAL_ONLY
          CMM_SUPABASE_NETWORK_ID: ${{ steps.supabase_network.outputs.network_name }}
        run: node scripts/ci/run-supabase-sql-proof.mjs --verify-canonical-schema-seed

      - name: Run PostgreSQL and concurrency proof
        id: run_sql_proof
        env:
          CMM_SUPABASE_CANDIDATE_SHA: ${{ github.sha }}
          CMM_SUPABASE_TEST_ENVIRONMENT: ephemeral
          CMM_SUPABASE_EPHEMERAL_TEST_AUTHORIZATION: I_UNDERSTAND_EPHEMERAL_ONLY
          CMM_SUPABASE_NETWORK_ID: ${{ steps.supabase_network.outputs.network_name }}
          CMM_SUPABASE_SQL_TARGETS: ${{ needs.plan.outputs.sql_proof_targets }}
        run: node scripts/ci/run-supabase-sql-proof.mjs

      - name: Stop ephemeral Supabase and remove network
        if: always()
        env:
          SUPABASE_NETWORK_NAME: ${{ steps.supabase_network.outputs.network_name }}
        run: |
          set +e
          ./node_modules/.bin/supabase stop --workdir apps/web --no-backup >/dev/null 2>&1
          if [ -n "$SUPABASE_NETWORK_NAME" ] && docker network inspect "$SUPABASE_NETWORK_NAME" >/dev/null 2>&1; then
            docker network rm "$SUPABASE_NETWORK_NAME" >/dev/null
          fi
          rm -f apps/web/.env.local

      - name: Finalize SQL stage evidence
        if: always()
        env:
          CMM_SUPABASE_CANDIDATE_SHA: ${{ github.sha }}
          CMM_STEP_BOOTSTRAP: ${{ steps.start_supabase.outcome }}
          CMM_STEP_DB_RESET: ${{ steps.apply_reset.outcome }}
          CMM_STEP_SCHEMA_SEED: ${{ steps.verify_schema_seed.outcome }}
          CMM_STEP_SQL_PROOF: ${{ steps.run_sql_proof.outcome }}
        run: node scripts/ci/run-supabase-sql-proof.mjs --finalize-workflow-evidence

      - name: Stage SQL evidence for convergence
        if: always()
        run: |
          mkdir -p artifacts/ci-public-evidence/evidence
          if [ -f artifacts/ci/supabase-sql-evidence.json ]; then
            cp artifacts/ci/supabase-sql-evidence.json artifacts/ci-public-evidence/evidence/supabase-sql.json
          fi

      - name: Validate public SQL evidence
        id: validate_evidence
        if: always()
        run: node scripts/checks/check-public-e2e-artifact.mjs artifacts/ci-public-evidence

      - name: Upload complete SQL proof evidence
        if: always() && hashFiles('artifacts/ci-public-evidence/evidence/supabase-sql.json') != '' && steps.validate_evidence.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cleanmymap-supabase-sql-evidence
          path: artifacts/ci-public-evidence
          if-no-files-found: error
          retention-days: 3

      - name: Upload redacted start diagnostic
        if: always() && steps.start_supabase.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: supabase-start-diagnostic
          path: artifacts/ci/supabase-start-diagnostic.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Remove private startup logs
        if: always()
        run: rm -f "$RUNNER_TEMP"/supabase-start-*.log "$RUNNER_TEMP"/supabase-start-*-progress.ndjson "$RUNNER_TEMP"/supabase-start-*-events.ndjson artifacts/ci/supabase-sql/*.log

  isolate-replay:
    name: Isolate bootstrap and first failing migration prefix
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'isolate-replay'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify manual run targets current main
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$current_main_sha"
          test "$current_main_sha" = "$GITHUB_SHA"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Isolate Supabase bootstrap and canonical migration prefixes
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/ci/isolate-supabase-migration-failure.mjs

      - name: Upload sanitized isolation evidence
        if: always() && hashFiles('artifacts/ci/supabase-isolation-diagnostic.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: supabase-isolated-migration-diagnostic
          path: artifacts/ci/supabase-isolation-diagnostic.json
          if-no-files-found: error
          retention-days: 3
