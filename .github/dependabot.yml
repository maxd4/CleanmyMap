version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Veille hebdomadaire bornée: les security updates restent actives et ne
    # sont pas bloquées par la limite des PR de version.
    open-pull-requests-limit: 6
    reviewers:
      - "maxd4"
    labels:
      - "dependencies"
    groups:
      # Expo packages and Expo modules share the SDK compatibility boundary.
      npm-mobile-expo-sdk:
        applies-to: "version-updates"
        update-types:
          - "patch"
          - "minor"
        patterns:
          - "@expo/*"
          - "expo*"
      # Clerk's Expo adapter has its own peer/runtime compatibility contract.
      npm-mobile-clerk-expo:
        applies-to: "version-updates"
        update-types:
          - "patch"
          - "minor"
        patterns:
          - "@clerk/expo"
      # React Native core is governed by the selected Expo SDK and must not be
      # bundled with independently versioned native libraries.
      npm-mobile-react-native-core:
        applies-to: "version-updates"
        update-types:
          - "patch"
          - "minor"
        patterns:
          - "react-native"
      # These libraries can be reviewed independently against the active SDK.
      npm-mobile-native-libraries:
        applies-to: "version-updates"
        update-types:
          - "patch"
          - "minor"
        patterns:
          - "react-native-*"
      npm-web-runtime:
        applies-to: "version-updates"
        update-types:
          - "patch"
          - "minor"
        patterns:
          - "@clerk/backend"
          - "@clerk/localizations"
          - "@clerk/nextjs"
          - "@sentry/nextjs"
          - "@upstash/*"
          - "framer-motion"
          - "lucide-react"
          - "next"
          - "posthog-*"
          - "resend"
          - "tailwind-merge"
          - "zod"
      npm-shared-runtime:
        applies-to: "version-updates"
        update-types:
          - "patch"
          - "minor"
        patterns:
          - "@supabase/*"
          - "react"
          - "react-dom"
      npm-tooling:
        applies-to: "version-updates"
        update-types:
          - "patch"
          - "minor"
        patterns:
          - "@clerk/testing"
          - "@playwright/*"
          - "@stryker-mutator/*"
          - "eslint"
          - "eslint-*"
          - "jiti"
          - "jscpd"
          - "knip"
          - "playwright"
          - "sharp"
          - "typescript"
          - "typescript-eslint"
          - "vitest"
      npm-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
    # Le lockfile racine couvre les workspaces `apps/web` et `apps/mobile`, donc
    # un seul bloc npm suffit pour le monorepo. Aucune règle ignore n'est ajoutée.
    # Les mises à jour majeures restent séparées pour une revue explicite.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Veille hebdomadaire bornée; les security updates restent actives.
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
      github-actions-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
    # Les Actions sont groupées par type de mise à jour; aucun automerge n'est
    # configuré dans ce dépôt.

  - package-ecosystem: "pip"
    directory: "/maintenance/python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "python"
    groups:
      python-maintenance-version-updates:
        applies-to: "version-updates"
        update-types:
          - "patch"
          - "minor"
        patterns:
          - "*"
      python-maintenance-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
