version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "maxd4"
    labels:
      - "dependencies"
      - "npm"
    groups:
      workspace-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
      workspace-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
    # Le lockfile racine couvre les workspaces `apps/web` et `apps/mobile`, donc un seul bloc npm
    # suffit pour le monorepo web. Aucune règle ignore n'est ajoutée ici:
    # aucune dépendance clairement non pertinente n'a été identifiée.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
    # Les Actions sont groupées pour éviter une PR par workflow tout en
    # conservant une revue unique des mises à jour.
