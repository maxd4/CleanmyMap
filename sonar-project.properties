# SonarQube Cloud manual analysis for the CleanMyMap monorepo.
# Source and test scopes intentionally start from the repository root so that
# JS/TS/Python files are not silently dropped when a workspace grows.
sonar.organization=maxd4
sonar.projectKey=maxd4_CleanmyMap
sonar.projectName=CleanMyMap
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8
sonar.python.version=3.14

sonar.sources=.
sonar.tests=.

# Sonar requires a file to be either source or test. Test inclusions also
# remove the same paths from the source scope; no source/test overlap remains.
# Do not classify every `test/` segment as a test tree: the web app contains a
# production email test endpoint under `src/app/api/email/test/`.
sonar.test.inclusions=**/__tests__/**,**/tests/**,**/*.test.js,**/*.test.jsx,**/*.test.mjs,**/*.test.cjs,**/*.test.ts,**/*.test.tsx,**/*.test.mts,**/*.test.cts,**/*.spec.js,**/*.spec.jsx,**/*.spec.mjs,**/*.spec.cjs,**/*.spec.ts,**/*.spec.tsx,**/*.spec.mts,**/*.spec.cts,**/test_*.py,**/*_test.py,**/conftest.py

# Dependency and generated trees are not first-party source. No business,
# coverage, duplication, or quality finding is excluded here.
sonar.exclusions=**/.git/**,**/node_modules/**,**/.next/**,**/coverage/**,**/dist/**,**/build/**,**/artifacts/**,**/.expo/**,**/.turbo/**

# Use the repository's current TypeScript projects; do not create or copy an
# Expo/Next configuration for Sonar. npm ci resolves their installed modules.
sonar.typescript.tsconfigPaths=apps/web/tsconfig.json,apps/mobile/tsconfig.json,scripts/cleanup/tsconfig.json
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info,apps/mobile/coverage/lcov.info,scripts/coverage/lcov.info
sonar.python.coverage.reportPaths=maintenance/python/coverage.xml
